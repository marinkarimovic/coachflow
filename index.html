function validState(x){return !!(x&&Array.isArray(x.players)&&Array.isArray(x.exercises)&&x.current&&Array.isArray(x.sessions))}
function recoveryAvailable(){try{return !!activeUserId&&validState(JSON.parse(localStorage.getItem(RECOVERY_KEY+'-'+activeUserId)||'null'))}catch(e){return false}}
function save(){
  if(!activeUserId)return false;
  if(storageLocked){notify('Datenschutz: lokaler Datensatz gesperrt. Bitte Originaldaten exportieren und Speicherstand wiederherstellen.');return false;}
  try{
    const previous=localStorage.getItem(accountKey()), next=JSON.stringify(data);
    if(previous&&previous!==next){
      try{if(validState(JSON.parse(previous)))localStorage.setItem(RECOVERY_KEY+'-'+activeUserId,previous)}catch(e){}
    }
    localStorage.setItem(accountKey(),next);window.CoachFlowAuth?.onSaved?.(next);
  }catch(e){notify('Lokales Speichern fehlgeschlagen. Bitte Speicherplatz prüfen und JSON-Backup erstellen.')}
}
function attendanceSignature(s=data.current){return String(s.date||'')+'|'+data.players.map(p=>String(p.id)+':'+(s.attendance?.[p.id]===false?'0':'1')).sort().join('|')}

function timerCheckpoint(){
  try{if(!activeUserId)return;localStorage.setItem(TIMER_KEY+'-'+activeUserId,JSON.stringify({date:data.current.date,round:data.current.currentRound||0,remaining:ui.timer,running:ui.running,at:Date.now()}))}catch(e){}
}
function restoreTimer(){
  ui.timer=data.current.stationMinutes*60;
  try{
    const state=JSON.parse((activeUserId?localStorage.getItem(TIMER_KEY+'-'+activeUserId):null)||'null');
    if(!state||state.date!==data.current.date||state.round!==(data.current.currentRound||0))return;
    const duration=data.current.stationMinutes*60;
    const remaining=Number(state.remaining);
    if(!Number.isFinite(remaining)||remaining<0||remaining>duration)return;
    const elapsed=state.running?Math.max(0,Math.floor((Date.now()-state.at)/1000)):0;
    ui.timer=Math.max(0,remaining-elapsed);
    ui.running=Boolean(state.running)&&ui.timer>0;
    ui.timerStamp=Date.now();
  }catch(e){}
}

function rotationView(s,valid){let groups=selectedGroups(s),rows=rotation(s);return `<div class="card"><div class="card-title"><h2>Automatische Rotation</h2><span class="badge">${groups.length} Gruppen · ${visibleStations(s)} Runden</span></div><p class="muted smalltxt">Jede Gruppe besucht jede Station einmal. Bei weniger Gruppen als Stationen bleibt pro Runde eine Station frei.</p>${groups.length>visibleStations(s)?`<div class="notice red section-gap">Bitte die Anzahl der Gruppen auf maximal ${visibleStations(s)} reduzieren.</div>`:''}${!valid?`<div class="notice section-gap">${ic('info')} Achtung: Trainerzuordnung ist nicht vollständig. Bitte im Planer klären.</div>`:''}<div class="rot-wrap section-gap"><table class="rot"><thead><tr><th>Runde</th>${groups.map(g=>`<th><span class="rotation-dot" style="background:${COLORS[g]}"></span>${g}<small>${groupPlayers(g,s).length} Kinder</small></th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${r.round}</strong><small>${addMin(s.start,+s.warm+(+s.welcome)+(r.round-1)*(+s.stationMinutes+(+s.breakMinutes)))}</small></td>${r.cells.map(c=>`<td><strong>${esc(c.exercise.name)}</strong><small>Station ${c.index+1} · ${esc(s.stationCoaches[c.index]||'ohne Trainer')}</small></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="inline section-gap">${btn(ic('print')+' PDF erstellen','print','btn')}${btn(ic('users')+' Gruppen anpassen','nav','ghost','data-value="squad"')}</div></div><div class="section-title">Belegung im Überblick</div><div class="grid cols-half">${Array.from({length:visibleStations(s)},(_,i)=>`<div class="card flat"><span class="phase-tag">Station ${i+1}</span><h3>${esc(exercise(s.exerciseIds[i]).name)}</h3><p class="muted smalltxt">Trainer: ${esc(s.stationCoaches[i]||'Nicht besetzt')}</p><div class="pillrow section-gap">${rows.map(r=>{let g=r.cells.find(c=>c.index===i)?.group;return `<span class="pill">R${r.round}: ${esc(g||'frei')}</span>`}).join('')}</div></div>`).join('')}</div>`}
function focusLive(s){

    const color=COLORS[c.group]||'#bdf576';
    return `<article class="cf-focus-station" style="--group-color:${color}"><div class="cf-focus-station-top"><span class="cf-focus-group">${esc(c.group)}</span><span class="cf-focus-count">${groupPlayers(c.group,s).length} Kinder</span></div><strong>Station ${c.index+1}</strong><div class="cf-focus-drill">${esc(c.exercise.name)}</div><div class="cf-focus-trainer">${esc(s.stationCoaches[c.index]||'Trainer nicht zugeordnet')}</div></article>`;
  }).join('');
  return `<section class="cf-focus-board" aria-label="Live-Trainingsansicht">
    <div class="cf-focus-top"><div><span class="cf-focus-kicker">LIVE · ${esc(data.team)} · ${esc(data.age)}</span><h2>Runde ${r+1} <span>von ${count}</span></h2></div>${btn('✕ Fokus verlassen','live-focus-toggle','ghost')}</div>
    <div class="cf-focus-timer"><div class="cf-focus-clock" id="timer-value" aria-live="off">${timeString(ui.timer)}</div><div class="cf-focus-timer-actions">${btn(ui.running?'❚❚ Pause':'▶ Start','timer-toggle','btn')}${btn('↺ Neustart','timer-reset','btn subtle')}</div><div class="progress"><div id="timer-progress" style="width:${Math.max(0,Math.min(100,ui.timer/(s.stationMinutes*60)*100))}%"></div></div></div>
    <div class="cf-focus-nav">${btn('← Vorherige Runde','prev-round','ghost',r===0?'disabled':'')}${btn(r===count-1?'Letzte Runde':'Nächste Runde →','next-round','btn',r===count-1?'disabled':'')}</div>
    <div class="cf-focus-section-heading"><h3>Jetzt auf dem Feld</h3><span>${presentPlayers(s).length} Kinder · ${count} Stationen</span></div>
    <div class="cf-focus-grid">${groups}</div><div class="cf-focus-tools">${btn("Tagesgruppen ausgleichen","balance","ghost")}${btn("Anwesenheit prüfen","review-live-attendance","ghost")}</div>
    ${next?`<div class="cf-focus-next"><strong>Als Nächstes · Runde ${r+2}</strong><div>${next.cells.map(x=>`<span style="border-color:${COLORS[x.group]};color:${COLORS[x.group]}">${esc(x.group)} → Station ${x.index+1}</span>`).join('')}</div></div>`:`<div class="cf-focus-next"><strong>Letzte Stationsrunde</strong><p>Danach Abschlussspiel und Trainingsabschluss.</p></div>`}
    ${!attendanceConfirmed(s)?`<div class="cf-live-review needs-review">⚠ Die tatsächliche Anwesenheit ist noch nicht bestätigt. ${btn('Anwesenheit prüfen','review-live-attendance','ghost small')}</div>`:'<div class="cf-live-review ok">✓ Anwesenheit bestätigt</div>'}
    <p class="cf-focus-hint">Der Timer berücksichtigt auch verstrichene Zeit nach einem kurzen Wechsel in eine andere App. Bei gesperrtem iPhone kann der Signalton fehlen; der Rundenwechsel erfolgt bewusst manuell.</p>
  </section>`;
}
function liveView(s){if(ui.liveFocus)return focusLive(s);let r=Math.min(s.currentRound||0,visibleStations(s)-1),rows=rotation(s),current=rows[r],done=s.completedIds||[];return `<div class="cf-live-toolbar"><div><strong>Training auf dem Platz</strong><p>Großer Timer, nächste Rotation und alle Stationen auf einen Blick.</p></div>${btn('Fokusmodus öffnen ↗','live-focus-toggle','btn')}</div><div class="cf-live-review ${attendanceConfirmed(s)?'ok':'needs-review'}">${attendanceConfirmed(s)?'✓ Anwesenheit für dieses Training bestätigt':'⚠ Vor dem Trainingsabschluss Anwesenheit bestätigen'}${!attendanceConfirmed(s)?btn('Zum Team','review-live-attendance','ghost small'):''}</div><div class="grid cols-2"><div class="timer-card"><div class="eyebrow" style="justify-content:center">LIVE-TRAINING · RUNDE ${r+1}/${visibleStations(s)}</div><div class="timer-display" id="timer-value">${timeString(ui.timer)}</div><p class="muted smalltxt">Countdown für die aktuelle Stationsrunde</p><div class="timer-buttons">${btn(ic(ui.running?'pause':'play')+' '+(ui.running?'Pause':'Start'),'timer-toggle','btn')}${btn(ic('reset')+' Reset','timer-reset','btn subtle')}</div><div class="progress section-gap"><div id="timer-progress" style="width:${Math.max(0,Math.min(100,ui.timer/(s.stationMinutes*60)*100))}%"></div></div><div class="between section-gap">${btn(ic('chevron')+' Zurück','prev-round','ghost small',r===0?'disabled':'')}${btn('Nächste Runde '+ic('arrow'),'next-round','btn small',r>=visibleStations(s)-1?'disabled':'')}</div></div><div class="card"><div class="card-title"><h2>Aktuelle Stationsbelegung</h2><span class="badge mutedbadge">${visibleStations(s)} Stationen</span></div>${current.cells.map(c=>`<div class="schedule-row"><span class="pill" style="min-width:72px;border-color:${COLORS[c.group]};color:${COLORS[c.group]}">${esc(c.group)}</span><div class="schedule-main"><div class="schedule-name">${esc(c.exercise.name)}</div><div class="schedule-sub">Station ${c.index+1} · ${esc(s.stationCoaches[c.index]||'nicht besetzt')}</div>${challengeAction(c.exercise,'live',true)}</div></div>`).join('')}<div class="notice blue section-gap">${ic('info')} Der Timer läuft nur solange die App geöffnet und aktiv ist. Ein gesperrtes iPhone kann die Aktualisierung verzögern.</div></div></div><div class="section-title"><span>Übungen als durchgeführt markieren</span><span class="muted smalltxt">${done.length}/${visibleStations(s)}</span></div><div class="card flat">${s.exerciseIds.slice(0,visibleStations(s)).map((eid,i)=>`<div class="checkline"><input type="checkbox" id="done-${i}" data-done-ex="${i}" ${done.includes(eid)?'checked':''}/><label for="done-${i}"><strong>${esc(exercise(eid).name)}</strong><div class="tiny">Station ${i+1} · ${esc(s.stationCoaches[i]||'ohne Trainer')}</div></label></div>`).join('')}<div class="inline section-gap">${btn(ic('check')+' Training abschließen','finish','btn')}${btn('Zur Planung','plan-tab','ghost','data-value="plan"')}</div><div class="tip section-gap">Nur bestätigte Übungen werden in der Trainingshistorie als tatsächlich durchgeführt gezählt. Die ursprüngliche Planung bleibt erhalten.</div></div>`}
function timeString(sec){let s=Math.max(0,Math.floor(sec));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function suggestBalance(){let groups=selectedGroups(),pool={};groups.forEach(g=>pool[g]=[]);let outsiders=[];presentPlayers().forEach(p=>{let g=assignedGroup(p);if(pool[g])pool[g].push(p);else outsiders.push(p)});let moves=[];for(const p of outsiders){let smallest=groups.slice().sort((a,b)=>pool[a].length-pool[b].length)[0];moves.push({pid:p.id,from:assignedGroup(p),to:smallest});pool[smallest].push(p)};let safety=0;while(safety++<50){let asc=groups.slice().sort((a,b)=>pool[a].length-pool[b].length);let lo=asc[0],hi=asc[asc.length-1];if(pool[hi].length-pool[lo].length<=1)break;let p=pool[hi].pop();pool[lo].push(p);moves.push({pid:p.id,from:hi,to:lo});}return moves}

outOf.length?`<div class="notice section-gap">${outOf.length} Kind(er) sind einer gerade ausgeblendeten Gruppe zugeordnet. Bitte umteilen oder Gruppenanzahl erhöhen.</div>`:''}<div class="divider"></div>${btn(ic('shuffle')+' Ausgleich vorschlagen','balance','btn secondary')}${btn('Tagesgruppen bearbeiten','squad-tab','ghost section-gap','data-value="groups"')}</div><div class="notice green">${ic('check')} Die Stammgruppen bleiben bestehen. Nur für diese Trainingseinheit vorgenommene Umbesetzungen werden im Plan gespeichert.</div></div></div>`}

iv class="section-title">Übungshäufigkeit</div><div class="card">${data.exercises.filter(e=>plannedCount(e.id)>0).sort((a,b)=>plannedCount(b.id)-plannedCount(a.id)).slice(0,8).map(e=>{let n=plannedCount(e.id);return `<div style="margin:10px 0"><div class="between smalltxt frequency-caption"><span>${esc(e.name)}</span><strong>${n}× geplant · ${doneCount(e.id)}× durchgeführt</strong></div><div class="progress" style="margin-top:5px"><div style="width:${Math.round(100*n/Math.max(1,...data.exercises.map(x=>plannedCount(x.id))))}%"></div></div></div>`}).join('')}</div>`}
function cfMatchFlush(){try{qs('#cf-match-iframe')?.contentWindow?.CFMatchdayFlush?.()}catch(e){console.warn('Spieltag konnte nicht pausiert werden:',e)}}
function cfMatchStore(){return data.matchdayV1||{}}
function cfMatchSelectedIds(){const stored=cfMatchStore().selectedIds;const available=new Set(data.players.map(p=>p.id));return (Array.isArray(stored)?stored:data.players.map(p=>p.id)).filter(id=>available.has(id))}
function cfMatchRoster(){const ids=new Set(cfMatchSelectedIds());return data.players.filter(p=>ids.has(p.id)).map(p=>({id:String(p.id),name:String(p.name)}))}
function cfMatchStarted(){const fun=cfMatchStore().funino;const hall=cfMatchStore().hall;return ui.matchMode==='funino'?!!(fun&&(fun.game>1||fun.history?.length||fun.goals?.length||fun.running||fun.finished)):!!(hall&&hall.events&&Object.values(hall.events).some(e=>e?.running))}
function cfMatchCompleted(){
  const m=cfMatchStore(),mode=ui.matchMode;
  if(mode==='funino'){
    const state=m.funino;if(!state?.history?.length)return [];
    const eventId='integrated:funino:'+String(state.sessionId||'prototype');
    const games=state.history.map(h=>({id:'funino-'+h.game,game:Number(h.game),label:'Spiel '+h.game+' · '+(h.opponent||'Gegner')+' · '+h.ours+':'+h.theirs,max:state.duration||7}));
    return [{eventId,eventName:'FUNiño-Spieltag',date:String(state.history[0]?.date||new Date().toISOString()).slice(0,10),games}];
  }
  const state=m.hall,active=state?.active,event=state?.events?.[active];if(!event)return [];
  const club=String(state.team||data.team).toLocaleLowerCase('de');
  const rows=[...(event.fixtures||[]),...(event.ko||[])].filter(f=>f.completed&&(String(f.home||'').toLocaleLowerCase('de')===club||String(f.away||'').toLocaleLowerCase('de')===club));
  if(!rows.length)return [];
  const eventName=state.tournaments?.find(t=>t.id===active)?.title||'Hallenturnier';
  return [{eventId:'integrated:hall:'+active,eventName,date:state.tournaments?.find(t=>t.id===active)?.date||new Date().toISOString().slice(0,10),games:rows.map((g,i)=>({id:String(g.id),game:i+1,label:'Spiel '+(i+1)+' · '+String(g.home).slice(0,30)+' – '+String(g.away).slice(0,30),max:event.duration||state.duration||10}))}];
}
function cfMatchMinuteForm(){
  const events=cfMatchCompleted(),current=events[0];if(!current)return '<p class="muted smalltxt">Sobald ein Spiel abgeschlossen ist, kannst du hier die Einsatzzeit je Kind bestätigen.</p>';
  const game=current.games.find(g=>g.id===ui.matchGameId)||current.games.at(-1);
  const reports=data.extensionsV18?.matchdayReports||[];
  const record=reports.find(x=>x.eventId===current.eventId)?.games?.find(g=>g.sourceId===game.id);
  const roster=ui.matchMode==='funino'?(cfMatchStore().funino?.playerRefs||cfMatchRoster()):(cfMatchStore().hall?.playerRefs||cfMatchRoster());
  return `<div class="cf-match-countline"><strong>${esc(current.eventName)}</strong><span>${current.games.length} abgeschlossene Spiele</span></div>
  <label class="field"><span>Spiel auswählen</span><select id="cf-match-game" class="input">${current.games.map(g=>`<option value="${esc(g.id)}" ${g.id===game.id?'selected':''}>${esc(g.label)}</option>`).join('')}</select></label>
  <p class="muted smalltxt">Nur tatsächlich gespielte Minuten eintragen. <strong>Leer = unbekannt</strong>, ausdrücklich <strong>0 = nicht eingesetzt</strong>.</p>
  <div class="cf-match-min-grid">${roster.map(p=>`<label class="cf-match-min-row"><span>${esc(p.name)}</span><input type="number" class="input" data-match-minute="${esc(p.id)}" min="0" max="${Number(game.max)}" step="1" inputmode="numeric" placeholder="–" value="${Number.isInteger(record?.minutes?.[p.id])?record.minutes[p.id]:''}"/><span>Min.</span></label>`).join('')}</div>
  ${btn('✓ Spielminuten bestätigen','matchday-save-minutes','btn')}
  <p class="tip">Diese Minuten erscheinen anschließend automatisch in „Team → Turnier-Teams → Spielzeit & faire Teams“.</p>`;
}

  <div class="cf-match-overview"><div class="cf-match-metric"><strong>${ids.length}</strong><span>Ausgewählte Kinder</span></div><div class="cf-match-metric"><strong>${connected}</strong><span>FUNiño-Spiele</span></div><div class="cf-match-metric"><strong>${number}</strong><span>Hallenturniere</span></div></div>

    ${saved.length?`<div class="cf-match-from-saved"><label>Gespeichertes Turnier-Team übernehmen<select class="input" id="cf-match-saved-team"><option value="">Aufstellung auswählen</option>${saved.map((t,i)=>(t.teams||[]).map((team,j)=>`<option value="${i}:${j}">${esc(t.title)} · ${esc(team.name)} (${team.members.length})</option>`).join('')).join('')}</select></label>${btn('Team übernehmen','matchday-use-team','btn secondary')}</div>`:''}
  </details>
  <div class="cf-match-mode-switch">${btn('⚽ FUNiño','matchday-mode',mode==='funino'?'btn':'ghost',`data-value="funino"`)}${btn('🏆 Hallenturnier','matchday-mode',mode==='hall'?'btn':'ghost',`data-value="hall"`)}</div>
  ${!roster.length?'<div class="notice red">Wähle zuerst mindestens ein Kind unter „Kader für den Spieltag“ aus. Danach kannst du direkt starten.</div>':mode==='funino'&&roster.length>30?'<div class="notice red">FUNiño unterstützt bis zu 30 Kinder pro Spieltag. Bitte die Auswahl eingrenzen.</div>':`<div class="cf-match-frame-wrap"><iframe id="cf-match-iframe" title="${mode==='funino'?'FUNiño Matchday':'Hallenturnier'}" src="./matchday-${mode}.html" loading="eager" allow="fullscreen"></iframe></div>`}
  <details class="card cf-match-minute-details"><summary>⏱ Einsatzminuten dokumentieren</summary><div id="cf-match-minutes">${cfMatchMinuteForm()}</div></details>
  <p class="tip">Alle Spieltagsdaten werden automatisch unter demselben Benutzerkonto wie Trainings und Anwesenheiten gespeichert. Bei Cloud-Konflikten bitte die Statusmeldung oben beachten.</p>`;
}

/* Client-side PDF generator – no network, no print() (iOS 27 PWA compatible). */
let currentPdfUrl=null,currentPdfBlob=null;
function pdfPlain(value){return String(value??'').replace(/[\u2013\u2014]/g,'-').replace(/\u2192/g,' -> ').replace(/\u2190/g,' <- ').replace(/\u2022/g,' - ').replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/[^\x20-\x7E\u00A0-\u00FF]/g,'?')}
function pdfBytes(text){const out=new Uint8Array(text.length);for(let i=0;i<text.length;i++)out[i]=text.charCodeAt(i)&255;return out}
function createTrainingPdf(session=data.current){
 const W=595,H=842,M=40,bottom=52;const pages=[];let commands=[],y=H-M;
 const rgb=(hex)=>{hex=hex.replace('#','');return [0,2,4].map(i=>(parseInt(hex.slice(i,i+2),16)/255).toFixed(3)).join(' ')};
 const F=(t)=>pdfPlain(t).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
 const page=()=>{if(commands.length)pages.push(commands.join('\n'));commands=[];y=H-M};
 const box=(x,top,w,h,color)=>commands.push(`${rgb(color)} rg ${x.toFixed(1)} ${(H-top-h).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)} re f`);
 const line=(x1,top1,x2,top2,color='#cccccc')=>commands.push(`${rgb(color)} RG 0.65 w ${x1.toFixed(1)} ${(H-top1).toFixed(1)} m ${x2.toFixed(1)} ${(H-top2).toFixed(1)} l S`);
 const txt=(str,x,top,size=10,bold=false,color='#1b2a28')=>commands.push(`BT /${bold?'F2':'F1'} ${size} Tf ${rgb(color)} rg 1 0 0 1 ${x.toFixed(1)} ${top.toFixed(1)} Tm (${F(str)}) Tj ET`);
 const chunks=(str,max)=>{const output=[];for(const paragraph of pdfPlain(str).split(/\n/)){const words=paragraph.split(/\s+/);let row='';for(const word of words){if((row+' '+word).trim().length>max && row){output.push(row);row=word}else row+=(row?' ':'')+word}output.push(row)}return output};
 const ensure=(need)=>{if(y-need<bottom)page()};
 const textLine=(s,sz=10,bold=false,color='#1b2a28',x=M,indent=0)=>{ensure(sz+5);txt(s,x,y,sz,bold,color);y-=sz+5+indent};
 const wrap=(s,max=87,sz=10,bold=false,color='#1b2a28',left=M)=>{for(const row of chunks(s,max))textLine(row,sz,bold,color,left)};
 const section=(label)=>{y-=3;ensure(35);box(M,H-y-7,W-2*M,22,'#dcefe3');txt(label,M+9,y-8,11,true,'#1e4536');y-=26};
 box(0,0,W,7,'#86c94b');
 textLine(`${data.team} ${data.age}`,19,true,'#143b30');
 textLine(`${localDate(session.date)}  |  ${session.start} - ${addMin(session.start,totalDuration(session))}`,10,false,'#61716a');
 wrap(`THEMA: ${session.theme}`,60,12,true);
 textLine(`Kinder: ${session.headcount??presentPlayers(session).length}   Trainer: ${(session.availableCoaches||[]).length}   Gruppen: ${session.groupCount}   Stationen: ${session.stationCount}`,9);
 section('TRAININGSABLAUF');
 for(const t of timetable(session)){wrap(`${t.time}  |  ${t.name}  (${t.minutes} Min.)`,77,10,true)}
 section('GRUPPEN & ANWESENHEIT');
 if(session.attendance){for(const g of selectedGroups(session)){const ppl=groupPlayers(g,session).map(p=>p.name);textLine(`${g} (${ppl.length}): ${ppl.join(', ')||'keine Kinder'}`,9,false,'#20372d')}}
 else textLine(`Archiv-Vorbereitung: ${session.headcount||'?'} Kinder; konkrete Tagesgruppen nicht hinterlegt.`,9,false,'#20372d');
 section('STATIONEN & TRAINER');
 session.exerciseIds.slice(0,visibleStations(session)).forEach((id,i)=>{const ex=exercise(id);ensure(45);textLine(`${i+1}. ${ex.name}  |  Trainer: ${(session.stationCoaches||[])[i]||'offen'}`,10,true);wrap(ex.description||'',88,9,false,'#5c6c64');y-=2});
 wrap(`Je Station ${session.stationMinutes} Minuten, dazwischen ${session.breakMinutes} Minuten Wechselpause.`,85,9);
 section('ROTATION');
 const gs=selectedGroups(session),width=(W-2*M-48)/gs.length;
 ensure(34);box(M,H-y-8,W-2*M,22,'#204c39');txt('R',M+10,y-7,9,true,'#ffffff');gs.forEach((g,i)=>txt(g,M+48+i*width+4,y-7,9,true,'#ffffff'));y-=31;
 rotation(session).forEach(r=>{let h=20;for(const c of r.cells)h=Math.max(h,10+chunks(c.exercise.name,Math.max(12,Math.floor(width/5.8))).length*11+9);ensure(h+2);if(r.round%2===0)box(M,H-y-8,W-2*M,h,'#eef3ef');txt(String(r.round),M+10,y-7,9,true);r.cells.forEach((c,i)=>chunks(c.exercise.name,Math.max(12,Math.floor(width/5.8))).forEach((name,j)=>txt(name,M+48+i*width+4,y-7-j*11,8,false)));y-=h+3;line(M,H-y+4,W-M,H-y+4,'#dce2dd')});
 section('ABSCHLUSSSPIEL');
 wrap(`${session.finalMinutes} Minuten · Gruppen auf geeignete Felder verteilen, z. B. Funino / 3 gegen 3 / 4 gegen 4.`,88,10);
 textLine(`Trainer: ${(session.availableCoaches||[]).join(', ')||'nicht hinterlegt'}`,9);
 y-=16;wrap('Erstellt mit SpielfeldIQ. Dies ist die aktuelle Vorbereitung; Anpassungen vor dem Training prüfen.',96,8,false,'#61716a');page();
 const objects=[null],add=s=>{objects.push(s);return objects.length-1};
 const font1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'),font2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
 const pgRoot=add('');const refs=[];
 pages.forEach((cmd,i)=>{const stream=cmd+'\n';const contentId=add(`<< /Length ${pdfBytes(stream).length} >>\nstream\n${stream}endstream`);const pageId=add(`<< /Type /Page /Parent ${pgRoot} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${font1} 0 R /F2 ${font2} 0 R >> >> /Contents ${contentId} 0 R >>`);refs.push(pageId)});
 objects[pgRoot]=`<< /Type /Pages /Kids [${refs.map(id=>`${id} 0 R`).join(' ')}] /Count ${refs.length} >>`;
 const catalog=add(`<< /Type /Catalog /Pages ${pgRoot} 0 R >>`);
 let doc='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const offsets=[0];for(let i=1;i<objects.length;i++){offsets[i]=pdfBytes(doc).length;doc+=`${i} 0 obj\n${objects[i]}\nendobj\n`};const start=pdfBytes(doc).length;doc+=`xref\n0 ${objects.length}\n0000000000 65535 f \n`;for(let i=1;i<objects.length;i++)doc+=`${String(offsets[i]).padStart(10,'0')} 00000 n \n`;doc+=`trailer\n<< /Size ${objects.length} /Root ${catalog} 0 R >>\nstartxref\n${start}\n%%EOF`;
 return new Blob([pdfBytes(doc)],{type:'application/pdf'});
}
function preparePdf(){if(currentPdfUrl)URL.revokeObjectURL(currentPdfUrl);currentPdfBlob=createTrainingPdf();currentPdfUrl=URL.createObjectURL(currentPdfBlob);ui.modal={type:'pdf-ready'};renderModal()}
async function sharePdf(){if(!currentPdfBlob)return;const file=new File([currentPdfBlob],`SpielfeldIQ-Training-${data.current.date}.pdf`,{type:'application/pdf'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){try{await navigator.share({files:[file],title:'SpielfeldIQ · Trainingsvorbereitung'});return}catch(e){if(e?.name==='AbortError')return;notify('Teilen nicht möglich. PDF über die Vorschau öffnen.');return}}notify('PDF kann über Öffnen oder Herunterladen weitergegeben werden.')}

function resetTimer(){ui.running=false;ui.timer=data.current.stationMinutes*60;ui.timerStamp=Date.now();timerCheckpoint()}
function choosePage(v){if(ui.view==='matchday'&&v!=='matchday')cfMatchFlush();ui.view=v;ui.liveFocus=false;ui.modal=null;ui.query='';render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;if(b.classList.contains('modal-back')&&e.target!==b)return;const a=b.dataset.act,value=b.dataset.value,bid=b.dataset.id;switch(a){case'nav':choosePage(value);break;case'matchday-mode':if(ui.matchMode!==value)cfMatchFlush();ui.matchMode=value==='hall'?'hall':'funino';ui.matchGameId=null;render();break;case'matchday-all':if(cfMatchStarted()){notify('Laufender Spieltag: erst das Turnier abschließen oder zurücksetzen.');break;}edit(()=>{data.matchdayV1||={};data.matchdayV1.selectedIds=data.players.map(p=>p.id)});break;
case'matchday-none':if(cfMatchStarted()){notify('Laufender Spieltag: erst das Turnier abschließen oder zurücksetzen.');break;}edit(()=>{data.matchdayV1||={};data.matchdayV1.selectedIds=[]});break;
case'matchday-use-team':{
  if(cfMatchStarted()){notify('Laufender Spieltag: erst das Turnier abschließen oder zurücksetzen.');break;}
  const chosen=qs('#cf-match-saved-team')?.value;
  if(!chosen){notify('Bitte zuerst eine gespeicherte Mannschaft wählen.');break}
  const [tIndex,teamIndex]=chosen.split(':').map(Number);
  const saved=(data.extensionsV18?.tournaments||[]).slice().reverse();
  const group=saved[tIndex]?.teams?.[teamIndex];if(!group){notify('Aufstellung nicht gefunden.');break}
  const valid=new Set(data.players.map(p=>p.id)),ids=[...new Set(group.members||[])].filter(id=>valid.has(id));
  if(!ids.length){notify('In dieser Mannschaft sind keine aktuellen Kaderspieler.');break}
  edit(()=>{data.matchdayV1||={};data.matchdayV1.selectedIds=ids});
  notify('Turniermannschaft übernommen: '+ids.length+' Kinder');break;
}
case'matchday-save-minutes':{
  const events=cfMatchCompleted(),entry=events[0],game=entry?.games?.find(g=>g.id===(ui.matchGameId||entry.games.at(-1)?.id));
  if(!entry||!game){notify('Bitte zunächst ein Spiel abschließen.');break}
  const refs=ui.matchMode==='funino'?(cfMatchStore().funino?.playerRefs||cfMatchRoster()):(cfMatchStore().hall?.playerRefs||cfMatchRoster());
  const known=new Set(refs.map(x=>x.id)),mins={};let count=0;
  for(const input of document.querySelectorAll('#cf-match-minutes [data-match-minute]')){
    if(!known.has(input.dataset.matchMinute))continue;
    const text=input.value.trim();if(!text)continue;
    const value=Number(text);
    if(!Number.isInteger(value)||value<0||value>game.max){notify('Spielminuten müssen zwischen 0 und '+game.max+' liegen.');return}
    mins[input.dataset.matchMinute]=value;count++;
  }
  if(!count){notify('Noch keine tatsächlichen Einsatzminuten eingegeben.');break}
  if(!confirmDialog('Die '+count+' ausdrücklich erfassten Spielzeitwerte für '+game.label+' speichern? Leere Felder bleiben unbekannt.'))break;
  data.extensionsV18||={};data.extensionsV18.matchdayReports||=[];
  const list=data.extensionsV18.matchdayReports,ix=list.findIndex(e=>e.eventId===entry.eventId);
  const report=ix>=0?list[ix]:{eventId:entry.eventId,eventName:entry.eventName,date:entry.date,games:[]};
  const row={game:game.game,sourceId:game.id,minutes:mins,loggedAt:new Date().toISOString()};
  report.games=report.games.filter(g=>g.sourceId!==game.id).concat(row).sort((a,b)=>a.game-b.game);
  if(ix<0)list.push(report);else list[ix]=report;
