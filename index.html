function fresh(){let players=Array.from({length:24},(_,i)=>({id:'p'+(i+1),name:`Kind ${String(i+1).padStart(2,'0')}`,baseGroup:GROUPS[Math.floor(i/6)]}));const coaches=['Trainer C','Trainer A','Trainer B','Trainer D','Trainer E','Trainer F','Trainer G'];return {team:'SC Marchtrenk',age:'U7',players,coaches,exercises:EX,sessions:sessionsSeed,current:{id:'current',date:nextTrainingDate(),theme:'Freie Räume & Entscheidung',status:'draft',start:'17:05',warm:10,welcome:3,stationMinutes:10,breakMinutes:2,finalMinutes:16,groupCount:4,stationCount:4,exerciseIds:['ex1','ex2','ex3','ex4'],stationCoaches:['Trainer A','Trainer B','Trainer C','Trainer D'],availableCoaches:['Trainer A','Trainer B','Trainer C','Trainer D'],attendance:Object.fromEntries(players.map(p=>[p.id,true])),overrides:{},completedIds:[],currentRound:0}}}
function load(){try{let s=localStorage.getItem(KEY);if(s){const x=JSON.parse(s);if(x&&Array.isArray(x.players)&&Array.isArray(x.exercises)&&x.current&&Array.isArray(x.sessions))return x;}}catch(e){}return fresh()}
let data=load();const ui={view:'home',filter:'Alle',query:'',squadTab:'attendance',planTab:'plan',modal:null,chosenStation:0,historyId:null,balanceMoves:[],timer:600,running:false,timerStamp:0,toastId:null};
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){notify('Lokales Speichern fehlgeschlagen – Speicher prüfen.')}}
function notify(msg){let t=qs('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(ui.toastId);ui.toastId=setTimeout(()=>t.classList.remove('show'),2600)}
function edit(mut){mut();save();render()}
const btn=(label,act,kind='btn',extra='')=>`<button type="button" class="${kind}" data-act="${act}" ${extra}>${label}</button>`;
function tSpan(s){return esc(s)}
function presentPlayers(s=data.current){return data.players.filter(p=>s.attendance?.[p.id]!==false)}
const assignedGroup=(p,s=data.current)=>s.overrides?.[p.id]||p.baseGroup;
function selectedGroups(s=data.current){return GROUPS.slice(0,Math.max(1,Number(s.groupCount)||4))}
function groupPlayers(group,s=data.current){return presentPlayers(s).filter(p=>assignedGroup(p,s)===group)}
function visibleStations(s=data.current){return Math.max(1,Math.min(4,Number(s.stationCount)||4))}
function rotation(s=data.current){let count=visibleStations(s),groups=selectedGroups(s);return Array.from({length:count},(_,r)=>({round:r+1,cells:groups.map((group,g)=>({group,index:(g+r)%count,exercise:exercise(s.exerciseIds[(g+r)%count])}))}))}
function exercise(eid){return data.exercises.find(e=>e.id===eid)||{id:'',name:'Übung auswählen',description:'Noch keine Übung zugewiesen',minutes:10,category:'Offen'}}
function doneCount(eid){return data.sessions.filter(s=>s.status==='done'&&s.completedIds?.includes(eid)).length+(data.current.status==='done'&&data.current.completedIds?.includes(eid)?1:0)}
function plannedCount(eid){return [...data.sessions,data.current].filter(s=>(s.exerciseIds||[]).includes(eid)).length}
function dateAndTime(){let s=data.current;return `${localDate(s.date)} · ${s.start} Uhr`}
function totalDuration(s=data.current){return Number(s.warm)+Number(s.welcome)+visibleStations(s)*Number(s.stationMinutes)+(visibleStations(s)-1)*Number(s.breakMinutes)+Number(s.finalMinutes)}
function timetable(s=data.current){let start=s.start,parts=[{time:start,name:'Freies Einstimmen',minutes:+s.warm}];start=addMin(start,+s.warm);parts.push({time:start,name:'Begrüßung & Gruppen',minutes:+s.welcome});start=addMin(start,+s.welcome);parts.push({time:start,name:`Stationen · ${visibleStations(s)} Runden`,minutes:visibleStations(s)*(+s.stationMinutes)+(visibleStations(s)-1)*(+s.breakMinutes)});start=addMin(start,parts[2].minutes);parts.push({time:start,name:'Abschlussspiele',minutes:+s.finalMinutes});return parts}
function isCoachesValid(s=data.current){return s.availableCoaches.length>=s.stationCount&&s.stationCoaches.slice(0,s.stationCount).every((c,i)=>c&&s.availableCoaches.includes(c)&&s.stationCoaches.indexOf(c)===i)}
function base(){return `<div class="app"><header class="topbar"><div class="brand"><div class="logo">${ic('ball',26)}</div><div><div class="brand-title">Coach<span>Flow</span></div><div class="subbrand">TRAIN SMARTER. PLAY BETTER.</div></div></div><div class="top-actions"><button class="icon-btn" data-act="settings" aria-label="Daten und Einstellungen">${ic('more',20)}</button></div></header><div id="screen">${screen()}</div><div class="footer-space"></div></div><nav class="nav" aria-label="Hauptnavigation">${[['home','home','Übersicht'],['library','book','Übungen'],['planner','calendar','Planer'],['squad','users','Team'],['history','chart','Historie']].map(([v,ico,l])=>`<button class="${ui.view===v?'active':''}" data-act="nav" data-value="${v}" aria-label="${l}">${ic(ico,21)}<span>${l}</span></button>`).join('')}</nav>`}
function head(title,kicker,sub='',right=''){return `<div class="headline"><div><div class="eyebrow">${esc(kicker)}</div><h1>${title}</h1>${sub?`<p class="lead">${sub}</p>`:''}</div>${right||''}</div>`}
function home(){const s=data.current,plandone=data.exercises.filter(e=>doneCount(e.id)>0).length;return `${head('Deine Trainingszentrale','SC MARCHTRENK · '+esc(data.age),'Sammeln. Planen. Trainieren. Besser werden.',btn(ic('plus')+' Neue Idee','add-exercise','btn'))}<div class="grid cols-4"><div class="stat"><div class="number">${data.exercises.length}</div><div class="statlabel">Übungen in Bibliothek</div><div class="up">${ic('book',13)} Für deine Trainings</div></div><div class="stat"><div class="number">${data.sessions.length}</div><div class="statlabel">Importierte Vorbereitungen</div><div class="up">${ic('calendar',13)} Als Vorlagen nutzbar</div></div><div class="stat"><div class="number">${presentPlayers().length}</div><div class="statlabel">Aktuell anwesende Kinder</div><div class="up">${ic('users',13)} ${data.players.length} im Kader</div></div><div class="stat"><div class="number">${plandone}</div><div class="statlabel">Nachweislich durchgeführt</div><div class="up">${ic('check',13)} Nach Training bestätigen</div></div></div><div class="grid cols-2 section-gap"><div class="card glow"><div class="between"><span class="hero-eyebrow">NÄCHSTE TRAININGSEINHEIT</span><span class="badge">${s.status==='done'?'Abgeschlossen':'IN PLANUNG'}</span></div><div class="hero-date">${dateAndTime()}</div><div class="hero-title">${esc(s.theme)}</div><p class="hero-desc">${presentPlayers().length} Kinder · ${s.availableCoaches.length} Trainer · ${visibleStations(s)} Stationen · ${totalDuration()} Minuten</p><div class="hero-foot"><div class="avatar-line"><div class="avatars">${s.availableCoaches.slice(0,4).map(n=>`<span class="avatar">${esc(n[0])}</span>`).join('')}</div>${esc(s.availableCoaches.slice(0,3).join(', '))}</div>${btn('Training planen '+ic('arrow'),'open-planner','btn')}</div></div><div class="card"><div class="card-title"><h2>Dein Trainingsablauf</h2><span class="badge mutedbadge">${totalDuration()} Min.</span></div>${timetable().map(x=>`<div class="schedule-row"><div class="schedule-index">${x.time}</div><div class="schedule-main"><div class="schedule-name">${esc(x.name)}</div><div class="schedule-sub">${x.minutes} Minuten</div></div>${ic('check',15)}</div>`).join('')}</div></div><div class="grid cols-2 section-gap"><div class="card"><div class="card-title"><h2>${ic('sparkles',20)} Trainingstipps</h2><span class="badge mutedbadge">DEMO-LOGIK</span></div><p class="muted smalltxt">Aus den importierten Vorbereitungen erkennt CoachFlow, welche Übungen du schon oft eingeplant hast und welche noch ungenutzt sind.</p><div class="divider"></div>${data.exercises.filter(e=>!data.current.exerciseIds.includes(e.id)).sort((a,b)=>plannedCount(a.id)-plannedCount(b.id)).slice(0,2).map(e=>`<div class="list-row"><div class="exercise-icon">${ic('ball')}</div><div class="schedule-main"><div class="schedule-name">${esc(e.name)}</div><div class="schedule-sub">Bisher ${plannedCount(e.id)}× eingeplant · ${doneCount(e.id)}× bestätigt</div></div>${btn(ic('plus'),'add-to-plan','ghost small',`data-id="${esc(e.id)}"`)}</div>`).join('')}${btn('Übungen entdecken '+ic('arrow'),'nav','ghost small section-gap','data-value="library"')}</div><div class="card"><div class="card-title"><h2>Zuletzt vorbereitet</h2>${btn('Alle anzeigen '+ic('chevron'),'nav','ghost small','data-value="history"')}</div>${data.sessions.slice().reverse().slice(0,3).map(s=>`<div class="list-row"><div class="schedule-index">${fmtShort(s.date)}</div><div class="schedule-main"><div class="schedule-name">${esc(s.theme)}</div><div class="schedule-sub">${s.headcount} Kinder · ${s.stationCount} Stationen · Vorbereitung</div></div>${btn(ic('arrow'),'duplicate','ghost small',`data-id="${s.id}" title="Als Vorlage übernehmen"`)}</div>`).join('')}<div class="desktop-note">Historische Dokumente gelten nicht automatisch als durchgeführte Trainings.</div></div></div>`}
function library(){let q=ui.query.toLocaleLowerCase('de'),f=ui.filter;let list=data.exercises.filter(e=>(f==='Alle'||(f==='Favoriten'?e.favorite:e.category===f))&&(`${e.name} ${e.category} ${e.description} ${e.equipment}`.toLocaleLowerCase('de').includes(q)));const cats=['Alle','Favoriten',...new Set(data.exercises.map(e=>e.category))];return `${head('Übungsbibliothek','DEINE IDEEN · DEIN WISSEN','Instagram-Links, eigene Ideen und bewährte Übungen an einem Ort.',btn(ic('plus')+' Übung anlegen','add-exercise','btn'))}<div class="card"><div class="searchbar">${ic('search')}<input id="exercise-search" placeholder="Übung, Thema oder Material suchen ..." value="${esc(ui.query)}" aria-label="Übungen durchsuchen"/></div><div class="pillrow section-gap">${cats.map(c=>`<button type="button" class="pill opt ${f===c?'selected':''}" data-act="filter" data-value="${esc(c)}">${esc(c)}</button>`).join('')}</div></div><div class="section-title"><span>${list.length} Übungen gefunden</span><span class="muted smalltxt">${data.exercises.length} insgesamt</span></div><div class="grid cols-half">${list.map(e=>`<div class="exercise"><div class="exercise-icon">${ic('ball',23)}</div><div class="exercise-body"><div class="between"><span class="badge mutedbadge">${esc(e.category)}</span>${btn(e.favorite?'★':'☆','favorite','ghost small',`data-id="${esc(e.id)}" title="Favorit ändern"`)}</div><h3 style="margin-top:9px">${esc(e.name)}</h3><p class="muted smalltxt">${esc(e.description)}</p><div class="detailset"><span class="pill">${ic('clock',13)} ${e.minutes} Min.</span><span class="pill">${esc(e.age||'U6–U10')}</span>${e.url?`<span class="pill">${ic('link',13)} Video-Link</span>`:''}</div><div class="exercise-foot"><span class="tiny">${plannedCount(e.id)}× geplant · ${doneCount(e.id)}× durchgeführt</span><div class="inline">${btn('Details','exercise-detail','ghost small',`data-id="${esc(e.id)}"`)}${btn(ic('plus')+' Plan','add-to-plan','btn small',`data-id="${esc(e.id)}"`)}</div></div></div></div>`).join('')}</div>${list.length?'':'<div class="empty">Keine passenden Übungen gefunden. Du kannst jederzeit eine neue Übung anlegen.</div>'}`}
function planner(){const s=data.current;const valid=isCoachesValid();return `${head('Trainingsplaner','TRAINING VORBEREITEN',esc(localDate(s.date))+' · '+totalDuration()+' Minuten',btn(ic('print')+' PDF / Drucken','print','btn subtle'))}<div class="tabs" style="margin-bottom:15px">${[['plan','Planung'],['rotation','Rotation'],['live','Live-Training']].map(([x,t])=>`<button class="tab ${ui.planTab===x?'active':''}" data-act="plan-tab" data-value="${x}">${t}</button>`).join('')}</div>${ui.planTab==='plan'?planDetail(s,valid):ui.planTab==='rotation'?rotationView(s,valid):liveView(s)}`}
function planDetail(s,valid){return `<div class="grid cols-2"><div class="card"><div class="card-title"><h2>Rahmendaten</h2><span class="badge mutedbadge">${esc(data.age)}</span></div><div class="field"><label>Trainingsthema</label><input id="theme" class="input" value="${esc(s.theme)}"/></div><div class="splitfields section-gap"><div class="field"><label>Datum</label><input id="session-date" type="date" class="input" value="${esc(s.date)}"/></div><div class="field"><label>Beginn</label><input id="session-start" type="time" class="input" value="${esc(s.start)}"/></div></div><div class="threefields section-gap"><div class="field"><label>Stationen</label><select id="station-count" class="input">${[2,3,4].map(n=>`<option value="${n}" ${+s.stationCount===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Gruppen</label><select id="group-count" class="input">${[2,3,4].map(n=>`<option value="${n}" ${+s.groupCount===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Min./Station</label><select id="station-minutes" class="input">${[8,10,12,15].map(n=>`<option value="${n}" ${+s.stationMinutes===n?'selected':''}>${n} Min.</option>`).join('')}</select></div></div><div class="splitfields section-gap"><div class="field"><label>Wechselpause</label><select id="break-minutes" class="input">${[0,1,2,3,4].map(n=>`<option value="${n}" ${+s.breakMinutes===n?'selected':''}>${n} Min.</option>`).join('')}</select></div><div class="field"><label>Abschlussspiel</label><select id="final-minutes" class="input">${[10,12,15,16,18,20].map(n=>`<option value="${n}" ${+s.finalMinutes===n?'selected':''}>${n} Min.</option>`).join('')}</select></div></div><div class="divider"></div><div class="between"><span class="muted smalltxt">Geplantes Trainingsende</span><strong>${addMin(s.start,totalDuration())}</strong></div><div class="between section-gap"><span class="muted smalltxt">Kinder anwesend</span>${btn(presentPlayers().length+' · Anwesenheit bearbeiten '+ic('arrow'),'nav','ghost small','data-value="squad"')}</div><div class="between section-gap"><span class="muted smalltxt">Trainer verfügbar</span><strong>${s.availableCoaches.length}</strong></div>${!valid?`<div class="notice section-gap">${ic('info')} Nicht alle Stationen sind eindeutig mit einem verfügbaren Trainer besetzt. Bitte Zuordnung prüfen oder Stationen reduzieren.</div>`:''}${s.groupCount>s.stationCount?`<div class="notice red section-gap">${ic('info')} Mehr Gruppen als Stationen: gleichzeitige Stationsbesuche nicht konfliktfrei möglich.</div>`:''}${s.availableCoaches.length<s.stationCount?`<div class="section-gap">${btn('Stationen an Trainerzahl anpassen','adjust-stations','btn secondary small')}</div>`:''}</div><div class="card"><div class="card-title"><h2>Trainingsablauf</h2><span class="badge mutedbadge">${totalDuration()} Minuten</span></div>${timetable(s).map((x,i)=>`<div class="schedule-row"><div class="schedule-index">${esc(x.time)}</div><div class="schedule-main"><div class="schedule-name">${esc(x.name)}</div><div class="schedule-sub">${x.minutes} Min.</div></div><span class="pill">${i+1}</span></div>`).join('')}<div class="divider"></div><div class="notice green">${ic('info')} Änderungen werden auf diesem Gerät automatisch gespeichert. Export über die Einstellungen möglich.</div></div></div><div class="section-title"><span>Stationen & Trainer</span>${btn(ic('sparkles')+' Ideen vorschlagen','suggest','btn secondary small')}</div><div class="grid cols-half">${Array.from({length:visibleStations(s)},(_,i)=>{let e=exercise(s.exerciseIds[i]);return `<div class="card flat"><div class="between"><span class="phase-tag">Station ${i+1}</span><span class="badge mutedbadge">${s.stationMinutes} Min.</span></div><h2 style="margin:8px 0">${esc(e.name)}</h2><p class="muted smalltxt">${esc(e.description)}</p><div class="detailset"><span class="pill">${ic('ball',13)} ${esc(e.category)}</span><span class="pill">${ic('clock',13)} ${s.stationMinutes} Min.</span></div><div class="divider"></div><div class="between"><div class="field" style="flex:1"><label>Verantwortlicher Trainer</label><select class="input" data-coach-slot="${i}"><option value="">Nicht besetzt</option>${data.coaches.map(c=>`<option value="${esc(c)}" ${s.stationCoaches[i]===c?'selected':''}>${esc(c)}${!s.availableCoaches.includes(c)?' (abwesend)':''}</option>`).join('')}</select></div>${btn(ic('swap'),'station-choose','ghost small',`data-slot="${i}" title="Übung ersetzen"`)}</div></div>`}).join('')}</div><div class="inline section-gap">${btn(ic('shuffle')+' Rotationsplan anzeigen','plan-tab','btn','data-value="rotation"')}${btn(ic('print')+' Trainingsblatt','print','btn subtle')}</div>`}
function rotationView(s,valid){let groups=selectedGroups(s),rows=rotation(s);return `<div class="card"><div class="card-title"><h2>Automatische Rotation</h2><span class="badge">${groups.length} Gruppen · ${visibleStations(s)} Runden</span></div><p class="muted smalltxt">Jede Gruppe besucht jede Station einmal. Bei weniger Gruppen als Stationen bleibt pro Runde eine Station frei.</p>${groups.length>visibleStations(s)?`<div class="notice red section-gap">Bitte die Anzahl der Gruppen auf maximal ${visibleStations(s)} reduzieren.</div>`:''}${!valid?`<div class="notice section-gap">${ic('info')} Achtung: Trainerzuordnung ist nicht vollständig. Bitte im Planer klären.</div>`:''}<div class="rot-wrap section-gap"><table class="rot"><thead><tr><th>Runde</th>${groups.map(g=>`<th><span class="rotation-dot" style="background:${COLORS[g]}"></span>${g}<small>${groupPlayers(g,s).length} Kinder</small></th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${r.round}</strong><small>${addMin(s.start,+s.warm+(+s.welcome)+(r.round-1)*(+s.stationMinutes+(+s.breakMinutes)))}</small></td>${r.cells.map(c=>`<td><strong>${esc(c.exercise.name)}</strong><small>Station ${c.index+1} · ${esc(s.stationCoaches[c.index]||'ohne Trainer')}</small></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="inline section-gap">${btn(ic('print')+' PDF / Druck','print','btn')}${btn(ic('users')+' Gruppen anpassen','nav','ghost','data-value="squad"')}</div></div><div class="section-title">Belegung im Überblick</div><div class="grid cols-half">${Array.from({length:visibleStations(s)},(_,i)=>`<div class="card flat"><span class="phase-tag">Station ${i+1}</span><h3>${esc(exercise(s.exerciseIds[i]).name)}</h3><p class="muted smalltxt">Trainer: ${esc(s.stationCoaches[i]||'Nicht besetzt')}</p><div class="pillrow section-gap">${rows.map(r=>{let g=r.cells.find(c=>c.index===i)?.group;return `<span class="pill">R${r.round}: ${esc(g||'frei')}</span>`}).join('')}</div></div>`).join('')}</div>`}
function liveView(s){let r=Math.min(s.currentRound||0,visibleStations(s)-1),rows=rotation(s),current=rows[r],done=s.completedIds||[];return `<div class="grid cols-2"><div class="timer-card"><div class="eyebrow" style="justify-content:center">LIVE-TRAINING · RUNDE ${r+1}/${visibleStations(s)}</div><div class="timer-display" id="timer-value">${timeString(ui.timer)}</div><p class="muted smalltxt">Countdown für die aktuelle Stationsrunde</p><div class="timer-buttons">${btn(ic(ui.running?'pause':'play')+' '+(ui.running?'Pause':'Start'),'timer-toggle','btn')}${btn(ic('reset')+' Reset','timer-reset','btn subtle')}</div><div class="progress section-gap"><div id="timer-progress" style="width:${Math.max(0,Math.min(100,ui.timer/(s.stationMinutes*60)*100))}%"></div></div><div class="between section-gap">${btn(ic('chevron')+' Zurück','prev-round','ghost small',r===0?'disabled':'')}${btn('Nächste Runde '+ic('arrow'),'next-round','btn small',r>=visibleStations(s)-1?'disabled':'')}</div></div><div class="card"><div class="card-title"><h2>Aktuelle Stationsbelegung</h2><span class="badge mutedbadge">${visibleStations(s)} Stationen</span></div>${current.cells.map(c=>`<div class="schedule-row"><span class="pill" style="min-width:72px;border-color:${COLORS[c.group]};color:${COLORS[c.group]}">${esc(c.group)}</span><div class="schedule-main"><div class="schedule-name">${esc(c.exercise.name)}</div><div class="schedule-sub">Station ${c.index+1} · ${esc(s.stationCoaches[c.index]||'nicht besetzt')}</div></div></div>`).join('')}<div class="notice blue section-gap">${ic('info')} Der Timer läuft nur solange die App geöffnet und aktiv ist. Ein gesperrtes iPhone kann die Aktualisierung verzögern.</div></div></div><div class="section-title"><span>Übungen als durchgeführt markieren</span><span class="muted smalltxt">${done.length}/${visibleStations(s)}</span></div><div class="card flat">${s.exerciseIds.slice(0,visibleStations(s)).map((eid,i)=>`<div class="checkline"><input type="checkbox" id="done-${i}" data-done-ex="${i}" ${done.includes(eid)?'checked':''}/><label for="done-${i}"><strong>${esc(exercise(eid).name)}</strong><div class="tiny">Station ${i+1} · ${esc(s.stationCoaches[i]||'ohne Trainer')}</div></label></div>`).join('')}<div class="inline section-gap">${btn(ic('check')+' Training abschließen','finish','btn')}${btn('Zur Planung','plan-tab','ghost','data-value="plan"')}</div><div class="tip section-gap">Nur bestätigte Übungen werden in der Trainingshistorie als tatsächlich durchgeführt gezählt. Die ursprüngliche Planung bleibt erhalten.</div></div>`}
function timeString(sec){let s=Math.max(0,Math.floor(sec));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function suggestBalance(){let groups=selectedGroups(),pool={};groups.forEach(g=>pool[g]=[]);let outsiders=[];presentPlayers().forEach(p=>{let g=assignedGroup(p);if(pool[g])pool[g].push(p);else outsiders.push(p)});let moves=[];for(const p of outsiders){let smallest=groups.slice().sort((a,b)=>pool[a].length-pool[b].length)[0];moves.push({pid:p.id,from:assignedGroup(p),to:smallest});pool[smallest].push(p)};let safety=0;while(safety++<50){let asc=groups.slice().sort((a,b)=>pool[a].length-pool[b].length);let lo=asc[0],hi=asc[asc.length-1];if(pool[hi].length-pool[lo].length<=1)break;let p=pool[hi].pop();pool[lo].push(p);moves.push({pid:p.id,from:hi,to:lo});}return moves}
function squad(){let s=data.current,tab=ui.squadTab;return `${head('Mein Team','KADER & GRUPPEN',esc(data.team)+' · '+esc(data.age)+' · '+data.players.length+' Kinder',btn(ic('plus')+' Kind hinzufügen','add-player','btn'))}<div class="grid cols-3"><div class="stat"><div class="number">${data.players.length}</div><div class="statlabel">Kinder im Kader</div></div><div class="stat"><div class="number">${presentPlayers().length}</div><div class="statlabel">Heute anwesend</div></div><div class="stat"><div class="number">${s.availableCoaches.length}</div><div class="statlabel">Trainer verfügbar</div></div></div><div class="tabs section-gap">${[['attendance','Anwesenheit'],['groups','Stammgruppen'],['coaches','Trainer']].map(([v,l])=>`<button class="tab ${tab===v?'active':''}" data-act="squad-tab" data-value="${v}">${l}</button>`).join('')}</div>${tab==='attendance'?attendance():tab==='groups'?roster():coaches()}`}
function attendance(){let s=data.current,moves=suggestBalance(),outOf=presentPlayers().filter(p=>!selectedGroups(s).includes(assignedGroup(p)));return `<div class="grid cols-2 section-gap"><div class="card"><div class="card-title"><h2>Anwesenheit fürs nächste Training</h2>${btn('Alle anwesend','all-present','ghost small')}</div><p class="muted smalltxt" style="margin-bottom:12px">Die Zuordnung zur Stammgruppe bleibt bei Tagesänderungen erhalten.</p>${data.players.map(p=>`<div class="player-row ${s.attendance[p.id]===false?'absent':''}"><input type="checkbox" id="att-${p.id}" data-attendance="${p.id}" ${s.attendance[p.id]!==false?'checked':''}/><div class="player-circle">${esc(p.name.slice(0,2).toUpperCase())}</div><label for="att-${p.id}" class="name">${esc(p.name)}</label><span class="pill" style="border-color:${COLORS[p.baseGroup]};color:${COLORS[p.baseGroup]}">${p.baseGroup}</span></div>`).join('')}</div><div class="stack"><div class="card"><div class="card-title"><h2>Tagesgruppen</h2><span class="badge">${presentPlayers().length} Kinder</span></div>${selectedGroups(s).map(g=>`<div class="schedule-row"><span class="rotation-dot" style="background:${COLORS[g]}"></span><div class="schedule-main"><strong>${g}</strong><div class="tiny">${groupPlayers(g,s).map(p=>esc(p.name)).join(', ')||'Keine Kinder'}</div></div><span class="badge mutedbadge">${groupPlayers(g,s).length}</span></div>`).join('')}${outOf.length?`<div class="notice section-gap">${outOf.length} Kind(er) sind einer gerade ausgeblendeten Gruppe zugeordnet. Bitte umteilen oder Gruppenanzahl erhöhen.</div>`:''}<div class="divider"></div>${btn(ic('shuffle')+' Ausgleich vorschlagen','balance','btn secondary')}${btn('Tagesgruppen bearbeiten','squad-tab','ghost section-gap','data-value="groups"')}</div><div class="notice green">${ic('check')} Die Stammgruppen bleiben bestehen. Nur für diese Trainingseinheit vorgenommene Umbesetzungen werden im Plan gespeichert.</div></div></div>`}
function roster(){let s=data.current;return `<div class="notice green section-gap">${ic('info')} Links: dauerhafte Stammgruppe. Rechts: optional abweichende Tagesgruppe. Änderungen rechts betreffen nur das nächste Training.</div><div class="grid cols-half section-gap">${data.players.map(p=>`<div class="player-row card flat" style="padding:12px"><div class="player-circle">${esc(p.name.slice(0,2).toUpperCase())}</div><div class="schedule-main"><div class="schedule-name">${esc(p.name)}</div><div class="tiny">${s.attendance[p.id]===false?'Heute abwesend':'Heute anwesend'}</div></div><div class="field"><label>Stamm</label><select class="input" data-base-group="${p.id}" style="padding:6px;min-height:34px;font-size:11px">${GROUPS.map(g=>`<option ${p.baseGroup===g?'selected':''}>${g}</option>`).join('')}</select></div><div class="field"><label>Heute</label><select class="input" data-day-group="${p.id}" style="padding:6px;min-height:34px;font-size:11px">${GROUPS.map(g=>`<option ${assignedGroup(p,s)===g?'selected':''}>${g}</option>`).join('')}</select></div></div>`).join('')}</div>`}
function coaches(){let s=data.current;return `<div class="grid cols-2 section-gap"><div class="card"><div class="card-title"><h2>Verfügbare Trainer</h2>${btn(ic('plus')+' Trainer','add-coach','ghost small')}</div>${data.coaches.map(n=>`<div class="coach-row"><input id="coach-${esc(n)}" type="checkbox" data-coach-avail="${esc(n)}" ${s.availableCoaches.includes(n)?'checked':''}/><label for="coach-${esc(n)}" class="name" style="flex:1;font-weight:720">${esc(n)}</label><span class="badge ${s.availableCoaches.includes(n)?'':'mutedbadge'}">${s.availableCoaches.includes(n)?'Dabei':'Abwesend'}</span></div>`).join('')}</div><div class="card"><h2>Trainereinsatz</h2><p class="muted smalltxt section-gap">Ein Trainer kann im Standardmodell eine parallel laufende Station betreuen.</p><div class="divider"></div>${s.stationCoaches.slice(0,visibleStations(s)).map((n,i)=>`<div class="schedule-row"><div class="schedule-index">${i+1}.</div><div class="schedule-main"><strong>${esc(exercise(s.exerciseIds[i]).name)}</strong><div class="tiny">${esc(n||'Nicht besetzt')}</div></div>${s.availableCoaches.includes(n)?ic('check'):ic('info')}</div>`).join('')}${s.availableCoaches.length<visibleStations(s)?`<div class="notice section-gap">Weniger Trainer als parallele Stationen verfügbar. Nutze die Schaltfläche im Planer, um Stationen zu reduzieren.</div>`:''}${btn('Stationen bearbeiten '+ic('arrow'),'nav','ghost section-gap','data-value="planner"')}</div></div>`}
function history(){let all=[...data.sessions,...(data.current.status==='done'?[data.current]:[])].slice().sort((a,b)=>b.date.localeCompare(a.date));let confirmed=all.filter(x=>x.status==='done');return `${head('Trainingshistorie','DEIN TRAININGS-TAGEBUCH','Was war geplant, was wurde wirklich durchgeführt?',btn(ic('download')+' Datenexport','export','btn subtle'))}<div class="grid cols-3"><div class="stat"><div class="number">${all.length}</div><div class="statlabel">Dokumentierte Vorbereitungen</div></div><div class="stat"><div class="number">${confirmed.length}</div><div class="statlabel">Als durchgeführt bestätigt</div></div><div class="stat"><div class="number">${data.exercises.filter(e=>doneCount(e.id)>0).length}</div><div class="statlabel">Verschiedene Übungen ausgeführt</div></div></div><div class="notice blue section-gap">${ic('info')} Die fünf aus deinen Screenshots übernommenen Einheiten gelten als <strong>Vorbereitungen</strong>. Eine tatsächliche Durchführung wurde nicht behauptet. Ein Training wird erst durch deine Bestätigung gezählt.</div><div class="section-title">Deine bisherigen Trainings</div><div class="grid cols-half">${all.map(s=>`<div class="history-card"><div class="between"><div class="hdate">${esc(localDate(s.date))}</div><span class="badge ${s.status==='done'?'':'mutedbadge'}">${s.status==='done'?'Durchgeführt':'Vorbereitung'}</span></div><div class="htitle">${esc(s.theme)}</div><div class="pillrow"><span class="pill">${s.headcount??presentPlayers(s).length} Kinder</span><span class="pill">${s.groupCount} Gruppen</span><span class="pill">${s.stationCount} Stationen</span></div><div class="divider"></div><div class="tiny">${s.exerciseIds.slice(0,s.stationCount).map(eid=>esc(exercise(eid).name)).join(' · ')}</div><div class="inline section-gap">${btn(ic('swap')+' Als Vorlage','duplicate','btn small',`data-id="${esc(s.id)}"`)}${btn('Details','history-detail','ghost small',`data-id="${esc(s.id)}"`)}</div></div>`).join('')}</div><div class="section-title">Übungshäufigkeit</div><div class="card">${data.exercises.filter(e=>plannedCount(e.id)>0).sort((a,b)=>plannedCount(b.id)-plannedCount(a.id)).slice(0,8).map(e=>{let n=plannedCount(e.id);return `<div style="margin:10px 0"><div class="between smalltxt"><span>${esc(e.name)}</span><strong>${n}× geplant · ${doneCount(e.id)}× durchgeführt</strong></div><div class="progress" style="margin-top:5px"><div style="width:${Math.round(100*n/Math.max(1,...data.exercises.map(x=>plannedCount(x.id))))}%"></div></div></div>`}).join('')}</div>`}
function screen(){switch(ui.view){case'home':return home();case'library':return library();case'planner':return planner();case'squad':return squad();case'history':return history();default:return home()}}
function render(){qs('#app').innerHTML=base();renderModal();updatePrintable();}
function renderModal(){let m=ui.modal;if(!m){qs('#modal-root').innerHTML='';return}let body='',title='';if(m.type==='add-exercise'){title='Neue Übung / Videoidee';body=`<form id="exercise-form" class="stack"><div class="field"><label>Name der Übung *</label><input class="input" name="name" placeholder="z. B. 3 gegen 3 – Druckzone" required maxlength="110"/></div><div class="field"><label>Instagram-, YouTube- oder Videolink (optional)</label><input class="input" name="url" type="url" placeholder="https://www.instagram.com/reel/..."/></div><div class="splitfields"><div class="field"><label>Kategorie</label><select class="input" name="category">${['Spielform','Dribbling','Passspiel','Überzahl','Raumverhalten','Torschuss','Koordination','Aufwärmen','Sonstiges'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Dauer (Minuten)</label><input class="input" type="number" min="1" max="90" value="10" name="minutes"/></div></div><div class="field"><label>Beschreibung</label><textarea class="input" name="description" placeholder="Wie funktioniert die Übung?"></textarea></div><div class="field"><label>Material</label><input class="input" name="equipment" placeholder="Hütchen, Bälle, Tore ..."/></div><div class="field"><label>Aufbau / Ablauf</label><textarea class="input" name="setup" placeholder="Spielfeld, Regeln, Varianten ..."></textarea></div><div class="field"><label>Coaching-Punkte</label><textarea class="input" name="coaching" placeholder="Worauf sollten die Kinder achten?"></textarea></div><button type="submit" class="btn">${ic('save')} Übung speichern</button><div class="tip">Ein eingefügter Instagram-Link wird gespeichert. Videos werden in diesem Offline-Prototyp nicht heruntergeladen und nicht automatisch durch KI analysiert.</div></form>`}
else if(m.type==='exercise-detail'){let e=exercise(m.id);title=esc(e.name);body=`<div class="pillrow"><span class="badge">${esc(e.category)}</span><span class="pill">${e.minutes} Min.</span><span class="pill">${esc(e.age||'U6–U10')}</span></div><p class="muted section-gap">${esc(e.description)}</p>${[['Aufbau & Ablauf',e.setup],['Material',e.equipment],['Coaching-Punkte',e.coaching]].map(([t,v])=>`<div class="details-block"><h3>${t}</h3><div>${esc(v||'Noch nicht hinterlegt.')}</div></div>`).join('')}<p class="tiny">${plannedCount(e.id)}× geplant · ${doneCount(e.id)}× als durchgeführt bestätigt</p><div class="inline section-gap">${e.url?`<a target="_blank" rel="noopener noreferrer" href="${esc(validUrl(e.url)||'#')}" class="btn subtle">${ic('external')} Video öffnen</a>`:''}${btn(ic('plus')+' Im Plan verwenden','add-to-plan','btn',`data-id="${esc(e.id)}"`)}</div>`}
else if(m.type==='pick-exercise'){title=`Übung für Station ${m.slot+1}`;body=`<div class="stack">${data.exercises.map(e=>`<button class="ghost" data-act="pick-exercise" data-id="${esc(e.id)}" data-slot="${m.slot}" style="display:flex;justify-content:space-between;text-align:left"><span><strong>${esc(e.name)}</strong><br/><span class="tiny">${esc(e.category)} · ${e.minutes} Min.</span></span>${ic('plus')}</button>`).join('')}</div>`}
else if(m.type==='choose-slot'){let e=exercise(m.id);title='In Trainingsplan übernehmen';body=`<p class="muted smalltxt">${esc(e.name)} – welche Station soll ersetzt werden?</p><div class="stack section-gap">${data.current.exerciseIds.slice(0,visibleStations()).map((x,i)=>`<button class="ghost" data-act="pick-exercise" data-id="${esc(m.id)}" data-slot="${i}" style="justify-content:space-between"><span>Station ${i+1} · ${esc(exercise(x).name)}</span>${ic('arrow')}</button>`).join('')}</div>`}
else if(m.type==='balance'){const moves=suggestBalance();title='Tagesgruppen ausgleichen';body=`${moves.length?`<p class="muted">CoachFlow schlägt ${moves.length} minimale Umbesetzung(en) für gleichmäßigere Gruppen vor. Die Stammgruppen bleiben unverändert.</p><div class="details-block">${moves.map(x=>{let p=data.players.find(p=>p.id===x.pid);return `<div class="schedule-row"><strong>${esc(p?.name||'Kind')}</strong><span class="tiny" style="margin-left:auto">${esc(x.from)} → ${esc(x.to)}</span></div>`}).join('')}</div>${btn(ic('check')+' Vorschlag übernehmen','apply-balance','btn')}`:'<div class="notice green">Die Tagesgruppen sind bereits ausgewogen. Keine Umbesetzung notwendig.</div>'}`}
else if(m.type==='suggest'){const picks=data.exercises.filter(e=>!data.current.exerciseIds.includes(e.id)).sort((a,b)=>plannedCount(a.id)-plannedCount(b.id)).slice(0,4);title='Übungen vorschlagen';body=`<div class="notice blue">${ic('sparkles')} Regelbasierter Demo-Vorschlag aus deiner Bibliothek. Eine echte KI-Anbindung ist im Prototyp noch nicht enthalten.</div><div class="stack section-gap">${picks.map(e=>`<div class="exercise"><div class="exercise-icon">${ic('ball')}</div><div class="exercise-body"><h3>${esc(e.name)}</h3><p class="tiny">${esc(e.category)} · ${plannedCount(e.id)}× bisher eingeplant</p>${btn(ic('plus')+' Übernehmen','add-to-plan','btn small section-gap',`data-id="${esc(e.id)}"`)}</div></div>`).join('')}</div>`}
else if(m.type==='add-player'){title='Kind zum Kader hinzufügen';body=`<form id="player-form" class="stack"><div class="field"><label>Name oder Kürzel *</label><input class="input" name="name" required maxlength="60" placeholder="z. B. Kind 25"/></div><div class="field"><label>Stammgruppe</label><select name="group" class="input">${GROUPS.map(g=>`<option>${g}</option>`).join('')}</select></div><button class="btn" type="submit">${ic('plus')} Kind anlegen</button></form>`}
else if(m.type==='add-coach'){title='Trainer hinzufügen';body=`<form id="coach-form" class="stack"><div class="field"><label>Trainername *</label><input class="input" name="name" required maxlength="60"/></div><button class="btn" type="submit">${ic('plus')} Trainer anlegen</button></form>`}
else if(m.type==='history-detail'){let s=[...data.sessions,data.current].find(x=>x.id===m.id);title='Trainingsvorbereitung';body=s?`<div class="muted smalltxt">${esc(localDate(s.date))}</div><h2 class="section-gap">${esc(s.theme)}</h2><div class="pillrow section-gap"><span class="pill">${s.headcount??presentPlayers(s).length} Kinder</span><span class="pill">${s.groupCount} Gruppen</span><span class="pill">${s.stationCount} Stationen</span></div><div class="details-block"><h3>Geplante Stationen</h3>${s.exerciseIds.slice(0,s.stationCount).map((x,i)=>`<p>${i+1}. ${esc(exercise(x).name)}</p>`).join('')}</div><div class="tip">Status: ${s.status==='done'?'Durchführung bestätigt':'Nur Vorbereitung belegt'}. Einzelne historische Kinderzuordnungen wurden bewusst nicht aus Bildern rekonstruiert.</div>${btn(ic('swap')+' Als Vorlage verwenden','duplicate','btn section-gap',`data-id="${s.id}"`)}`:''}
else if(m.type==='settings'){title='Einstellungen & Daten';body=`<div class="stack"><div class="field"><label>Verein / Team</label><input id="team-name" class="input" value="${esc(data.team)}"/></div><div class="field"><label>Altersklasse</label><select id="team-age" class="input">${Array.from({length:14},(_,i)=>'U'+(i+6)).map(a=>`<option ${data.age===a?'selected':''}>${a}</option>`).join('')}<option ${data.age==='Erwachsene'?'selected':''}>Erwachsene</option></select></div><div class="divider"></div>${btn(ic('download')+' Alle Daten als JSON exportieren','export','btn')}${btn(ic('upload')+' JSON-Daten importieren','import','ghost')}<input type="file" id="import-file" accept=".json,application/json" style="display:none"/><div class="notice green">${ic('info')} Daten bleiben ausschließlich im lokalen Speicher dieses Browsers. Keine Cloud, keine Anmeldung, keine Übertragung an Dritte. Bitte regelmäßig exportieren!</div>${btn(ic('trash')+' Demodaten zurücksetzen','reset-data','btn danger')}<p class="tip">CoachFlow Prototyp v1 · Eigenständige Offline-HTML-App. Zum geräteübergreifenden Einsatz später Datenbank und Anmeldung ergänzen.</p></div>`}
qs('#modal-root').innerHTML=`<div class="modal-back" data-act="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button class="icon-btn" type="button" data-act="close-modal" aria-label="Schließen">${ic('close')}</button></div>${body}</div></div>`}
function validUrl(str){try{let u=new URL(str);return u.protocol==='https:'||u.protocol==='http:'?u.href:null}catch(e){return null}}
function confirmDialog(s){return window.confirm(s)}
function updatePrintable(){let s=data.current,g=selectedGroups(s);let printDate=esc(localDate(s.date));let personList=presentPlayers();let html=`<div class="print-page"><h1>${esc(data.team)} ${esc(data.age)}</h1><p><strong>${printDate}</strong></p><p><strong>Thema:</strong> ${esc(s.theme)} · ${personList.length} Kinder · ${s.availableCoaches.length} Trainer</p><div class="keep"><h2>${s.start}–${addMin(s.start,+s.warm)} | Freies Einstimmen</h2><p>Alle anwesenden Kinder wärmen sich mit Ball im Feld auf.</p><h2>${addMin(s.start,+s.warm)}–${addMin(s.start,+s.warm+(+s.welcome))} | Begrüßung</h2><p>Anwesenheit, Thema erklären und Gruppen bilden.</p><h2>Gruppen</h2>${g.map(group=>`<p><span class="print-pill" style="background:${COLORS[group]};color:#091215"><strong>${group}</strong></span> ${groupPlayers(group,s).map(p=>esc(p.name)).join(' – ')||'—'}</p>`).join('')}${personList.filter(p=>!g.includes(assignedGroup(p,s))).length?`<p><strong>Nicht zugeordnet:</strong> ${personList.filter(p=>!g.includes(assignedGroup(p,s))).map(p=>esc(p.name)).join(', ')}</p>`:''}</div><div class="keep"><h2>${addMin(s.start,+s.warm+(+s.welcome))} | Stationen</h2>${s.exerciseIds.slice(0,visibleStations(s)).map((eid,i)=>`<p><strong>${i+1}. ${esc(exercise(eid).name)}</strong> – ${esc(s.stationCoaches[i]||'ohne Trainer')}<br/><span style="font-size:9pt">${esc(exercise(eid).description)}</span></p>`).join('')}<p>Dauer pro Station: ${s.stationMinutes} Minuten | Wechsel: ${s.breakMinutes} Minuten</p></div><div class="keep"><h2>Rotation</h2><table><thead><tr><th>Runde</th>${g.map(group=>`<th style="background:${COLORS[group]};color:#091215">${group}</th>`).join('')}</tr></thead><tbody>${rotation(s).map(r=>`<tr><td>${r.round}</td>${r.cells.map(c=>`<td>${esc(c.exercise.name)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="keep"><h2>${timetable(s).at(-1).time}–${addMin(s.start,totalDuration(s))} | Abschlussspiele</h2><p>Gruppen auf geeignete Felder verteilen; bei Bedarf 3 gegen 3 oder 4 gegen 4 spielen lassen.</p><p><strong>Trainer:</strong> ${s.availableCoaches.map(esc).join(' · ')}</p></div><p style="font-size:8pt;color:#555;margin-top:20px">Erstellt mit CoachFlow · Trainingsvorbereitung · ${new Date().toLocaleDateString('de-AT')}</p></div>`;qs('#print-root').innerHTML=html}
function exportData(){const contents=JSON.stringify({schema:'coachflow-v1',exportedAt:new Date().toISOString(),data},null,2),blob=new Blob([contents],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`CoachFlow-Backup-${new Date().toISOString().slice(0,10)}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('Backup-Datei erstellt')}
function resetTimer(){ui.running=false;ui.timer=data.current.stationMinutes*60}
function choosePage(v){ui.view=v;ui.modal=null;ui.query='';render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;if(b.classList.contains('modal-back')&&e.target!==b)return;const a=b.dataset.act,value=b.dataset.value,bid=b.dataset.id;switch(a){case'nav':choosePage(value);break;case'open-planner':choosePage('planner');break;case'plan-tab':ui.planTab=value;render();break;case'squad-tab':ui.squadTab=value;render();break;case'filter':ui.filter=value;render();break;case'settings':case'add-exercise':case'add-player':case'add-coach':case'suggest':ui.modal={type:a};renderModal();break;case'close-modal':ui.modal=null;renderModal();break;case'exercise-detail':case'history-detail':ui.modal={type:a,id:bid};renderModal();break;case'favorite':edit(()=>{const x=exercise(bid);x.favorite=!x.favorite});break;case'station-choose':ui.modal={type:'pick-exercise',slot:+b.dataset.slot};renderModal();break;case'add-to-plan':ui.modal={type:'choose-slot',id:bid};renderModal();break;case'pick-exercise':edit(()=>{data.current.exerciseIds[+b.dataset.slot]=bid;data.current.status='draft';ui.modal=null;ui.view='planner';ui.planTab='plan'});notify('Übung in Trainingsplan übernommen');break;case'all-present':edit(()=>{data.players.forEach(p=>data.current.attendance[p.id]=true)});break;case'balance':ui.modal={type:'balance'};renderModal();break;case'apply-balance':edit(()=>{suggestBalance().forEach(m=>{data.current.overrides[m.pid]=m.to});ui.modal=null});notify('Tagesgruppen ausgeglichen');break;case'adjust-stations':edit(()=>{data.current.stationCount=Math.max(2,Math.min(data.current.availableCoaches.length,4));data.current.groupCount=Math.min(data.current.groupCount,data.current.stationCount);data.current.stationCoaches=data.current.stationCoaches.slice(0,data.current.stationCount);resetTimer()});notify('Stationszahl angepasst');break;case'suggest':ui.modal={type:'suggest'};renderModal();break;case'duplicate':{let s=[...data.sessions,data.current].find(x=>x.id===bid);if(!s)return;if(!confirmDialog('Diese Vorbereitung als neue Planung übernehmen? Der aktuelle Entwurf wird ersetzt.'))return;edit(()=>{let now=data.current;data.current={...now,date:nextTrainingDate(),theme:s.theme,groupCount:s.groupCount,stationCount:s.stationCount,exerciseIds:s.exerciseIds.slice(),stationCoaches:s.stationCoaches.slice(),availableCoaches:s.availableCoaches?.filter(x=>data.coaches.includes(x))||now.availableCoaches.slice(),status:'draft',completedIds:[],currentRound:0,attendance:Object.fromEntries(data.players.map(p=>[p.id,true])),overrides:{},id:'current'};ui.view='planner';ui.planTab='plan';ui.modal=null;resetTimer()});notify('Vorbereitung als neuer Entwurf übernommen');break;}case'print':window.print();break;case'export':exportData();break;case'import':qs('#import-file')?.click();break;case'reset-data':if(confirmDialog('Alle lokal gespeicherten Änderungen löschen und die Beispieldaten wiederherstellen?')){data=fresh();save();ui.modal=null;ui.view='home';resetTimer();render();notify('Beispieldaten wiederhergestellt')}break;case'timer-toggle':if(ui.timer<=0)resetTimer();ui.running=!ui.running;ui.timerStamp=Date.now();render();break;case'timer-reset':resetTimer();render();break;case'prev-round':ui.running=false;data.current.currentRound=Math.max(0,data.current.currentRound-1);save();resetTimer();render();break;case'next-round':ui.running=false;data.current.currentRound=Math.min(visibleStations()-1,data.current.currentRound+1);save();resetTimer();render();break;case'finish':if(!confirmDialog('Training als abgeschlossen markieren? Nur angehakte Übungen zählen als durchgeführt.'))return;edit(()=>{data.current.status='done';data.sessions.push({...data.current,id:id(),headcount:presentPlayers().length,attendance:null,overrides:{...data.current.overrides}});data.current={...data.current,id:'current',date:nextTrainingAfter(data.current.date),status:'draft',completedIds:[],attendance:Object.fromEntries(data.players.map(p=>[p.id,true])),overrides:{},currentRound:0};ui.view='history';ui.planTab='plan';resetTimer()});notify('Training dokumentiert');break;default:break}});
document.addEventListener('change',e=>{let t=e.target;const s=data.current;let b=t.dataset;if(b.attendance)edit(()=>{s.attendance[b.attendance]=t.checked});else if(b.baseGroup)edit(()=>{let p=data.players.find(p=>p.id===b.baseGroup);p.baseGroup=t.value;if(s.overrides[p.id]===t.value)delete s.overrides[p.id]});else if(b.dayGroup)edit(()=>{let p=data.players.find(p=>p.id===b.dayGroup);if(p.baseGroup===t.value)delete s.overrides[p.id];else s.overrides[p.id]=t.value});else if(b.coachAvail)edit(()=>{let name=b.coachAvail;if(t.checked&&!s.availableCoaches.includes(name))s.availableCoaches.push(name);else if(!t.checked)s.availableCoaches=s.availableCoaches.filter(x=>x!==name)});else if(b.coachSlot!==undefined)edit(()=>{s.stationCoaches[+b.coachSlot]=t.value});else if(b.doneEx!==undefined)edit(()=>{let eid=s.exerciseIds[+b.doneEx];if(t.checked&&!s.completedIds.includes(eid))s.completedIds.push(eid);else if(!t.checked)s.completedIds=s.completedIds.filter(x=>x!==eid)});else if(t.id==='theme')edit(()=>{s.theme=t.value.trim()||'Neues Training'});else if(t.id==='session-date')edit(()=>{s.date=t.value||s.date});else if(t.id==='session-start')edit(()=>{s.start=t.value||s.start});else if(t.id==='station-count')edit(()=>{s.stationCount=+t.value;s.groupCount=Math.min(s.groupCount,s.stationCount);resetTimer()});else if(t.id==='group-count')edit(()=>{s.groupCount=+t.value});else if(t.id==='station-minutes')edit(()=>{s.stationMinutes=+t.value;resetTimer()});else if(t.id==='break-minutes')edit(()=>{s.breakMinutes=+t.value});else if(t.id==='final-minutes')edit(()=>{s.finalMinutes=+t.value});else if(t.id==='team-name')edit(()=>{data.team=t.value||data.team});else if(t.id==='team-age')edit(()=>{data.age=t.value});else if(t.id==='import-file'){let f=t.files?.[0];if(!f)return;if(f.size>3e6){notify('Datei zu groß (max. 3 MB)');return}let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.schema!=='coachflow-v1'||!x.data||!Array.isArray(x.data.players)||!Array.isArray(x.data.exercises)||!x.data.current||!Array.isArray(x.data.sessions))throw Error('Ungültiges Backup');if(!confirmDialog('Aktuelle Daten durch Backup ersetzen?'))return;data=x.data;save();ui.modal=null;ui.view='home';resetTimer();render();notify('Backup importiert')}catch(err){notify('Import nicht möglich: Ungültige CoachFlow-Datei')}};r.readAsText(f)}});
document.addEventListener('input',e=>{let t=e.target;if(t.id==='exercise-search'){let sel=t.selectionStart;ui.query=t.value;render();let nt=qs('#exercise-search');if(nt){nt.focus();nt.setSelectionRange(sel,sel)}}});
document.addEventListener('submit',e=>{if(!['exercise-form','player-form','coach-form'].includes(e.target.id))return;e.preventDefault();const form=e.target,f=new FormData(form);if(form.id==='exercise-form'){let name=String(f.get('name')||'').trim(),url=String(f.get('url')||'').trim();if(!name){notify('Bitte Namen eingeben');return}if(url&&!validUrl(url)){notify('Bitte gültige http(s)-URL eingeben');return}edit(()=>{data.exercises.unshift({id:id(),name,url:validUrl(url)||'',category:String(f.get('category')),minutes:Math.max(1,Math.min(90,+f.get('minutes')||10)),description:String(f.get('description')||'').trim(),setup:String(f.get('setup')||'').trim(),coaching:String(f.get('coaching')||'').trim(),equipment:String(f.get('equipment')||'').trim(),age:data.age,favorite:false});ui.modal=null;ui.view='library'});notify('Übung gespeichert')}else if(form.id==='player-form'){let name=String(f.get('name')||'').trim();if(!name)return;edit(()=>{let x={id:id(),name,baseGroup:String(f.get('group'))};data.players.push(x);data.current.attendance[x.id]=true;ui.modal=null});notify('Kind hinzugefügt')}else if(form.id==='coach-form'){let name=String(f.get('name')||'').trim();if(!name)return;if(data.coaches.includes(name)){notify('Trainer existiert bereits');return}edit(()=>{data.coaches.push(name);data.current.availableCoaches.push(name);ui.modal=null});notify('Trainer hinzugefügt')}});
setInterval(()=>{if(!ui.running)return;let now=Date.now(),delta=Math.floor((now-ui.timerStamp)/1000);if(delta<1)return;ui.timerStamp+=delta*1000;ui.timer=Math.max(0,ui.timer-delta);let el=qs('#timer-value'),prog=qs('#timer-progress');if(el)el.textContent=timeString(ui.timer);if(prog)prog.style.width=`${Math.max(0,ui.timer/(data.current.stationMinutes*60)*100)}%`;if(ui.timer===0){ui.running=false;notify('Runde beendet!')}} ,250);
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;renderModal()}});
resetTimer();render();
})();
</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }</script>
