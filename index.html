 .roster-card>.player-circle{width:36px;height:36px;grid-column:1;grid-row:1}
 .roster-card>.schedule-main{grid-column:2;grid-row:1;min-width:0}
 .roster-card .group-selects{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px;min-width:0}
 .roster-card .group-selects>.field{min-width:0}
 .roster-card select{width:100%;max-width:100%;font-size:15px!important;min-height:42px!important;padding:8px 10px!important}
 .tabs{max-width:100%;width:100%;min-height:48px;gap:3px}
 .tabs>.tab{flex:1 0 auto;min-height:39px;padding:9px 8px;text-align:center;font-size:12px}
 .exercise-foot .inline{gap:8px}
 .card-title{flex-wrap:wrap}
 .nav{padding:7px 6px calc(8px + env(safe-area-inset-bottom))}
 .nav button{min-width:0;min-height:53px;font-size:10.5px;gap:4px}
 .modal{padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:calc(100dvh - env(safe-area-inset-top) - 28px)}
 .modal .modal-head{top:-20px}
}
@media(max-width:380px){
 .topbar{gap:8px}
 .brand{gap:8px;min-width:0}
 .brand-title{font-size:19px}
 .subbrand{font-size:9px;letter-spacing:.9px}
 .logo{height:39px;width:39px;flex:none}
 .top-actions{flex:none}
 .grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
 .compact-stats>.stat{padding:12px;min-height:91px}
 .stat .number{font-size:28px}
 .roster-card .group-selects{gap:8px}
 .roster-card select{font-size:14px!important}
 .date-time-fields .input,.field .input{font-size:16px}
 .tabs>.tab{font-size:11px;padding:8px 5px}
 .modal{padding-left:12px;padding-right:12px}
 .pdf-action-row{grid-template-columns:1fr}
}

<div id="app"></div><div id="modal-root"></div><div id="print-root" class="print-only"></div><div id="toast" aria-live="polite"></div>
<script>
(()=>{'use strict';

const ic=(name,size=18)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.info}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs=s=>document.querySelector(s);
const GROUPS=['Blau','Gelb','Weiß','Schwarz'];const COLORS={Blau:'#49c9e0',Gelb:'#f3cc59',Weiß:'#e2e9eb',Schwarz:'#7d949a'};
const id=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const addMin=(time,min)=>{let [h,m]=String(time||'17:05').split(':').map(Number);let t=(h*60+m+min+1440)%1440;return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`};
const localDate=d=>{const dt=new Date(`${d}T12:00:00`);return dt.toLocaleDateString('de-AT',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})};
const fmtShort=d=>new Date(`${d}T12:00:00`).toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit'});
const nextTrainingDate=()=>{let d=new Date(),day=d.getDay(),offset=day<=1?1-day:day<=4?4-day:8-day;if(offset<=0)offset+=3;d.setDate(d.getDate()+offset);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const nextTrainingAfter=date=>{let d=new Date(`${date}T12:00:00`);for(let i=0;i<10;i++){d.setDate(d.getDate()+1);if([1,4].includes(d.getDay()))return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}return nextTrainingDate()};
const EX=[
['Funino','Spielform','Kleine Tore, viele Ballkontakte und mutige Entscheidungen.','4 Minitore, Hütchen, Bälle',12,'Kleine Felder mit mehreren Minitoren markieren. 3 gegen 3 spielen lassen.','Viele Ballaktionen ermöglichen, Tore auf beiden Seiten nutzen.'],
['Steilpass auf Stürmer','Passspiel','Breit anbieten und einen freien Mitspieler in die Tiefe anspielen.','Hütchen, Bälle, kleine Tore',10,'Zwei Angreifer kombinieren und spielen einen freien Stürmer an.','Blick vor dem Abspiel heben; nicht jeden Ball steil spielen.'],
['3 gegen 2 – Kopf hoch','Überzahl','Gegner binden und die freie Seite nutzen.','Hütchen, Bälle, 2 Tore',10,'3 Angreifer spielen gegen 2 Verteidiger zum Tor.','Freie Mitspieler erkennen; Tempo und Richtung variieren.'],
['Pass oder Abschluss?','Entscheidung','Erkennen, ob Pass oder eigener Abschluss sinnvoll ist.','Bälle, 2 Minitore, Hütchen',10,'Kleine Überzahlspiele mit Abschlussmöglichkeit aufbauen.','Entscheidungen selbst treffen lassen, kurz coachen.'],
['Passdreieck','Passspiel','Nach dem Pass sofort wieder eine freie Position suchen.','Bälle, Hütchen',10,'Dreieck markieren und Passwege mit Positionswechsel verbinden.','Passwinkel öffnen und erst schauen, dann spielen.'],
['Freie Anspielstation suchen','Passspiel','Mit und ohne Ball freie Räume erkennen.','Hütchen, Leibchen, Bälle',10,'Kleine Spielform mit freien Anspielstationen spielen.','Aktiv vom Gegner lösen und sich früh anbieten.'],
['Breit & Räume','Raumverhalten','Freie Seiten erkennen und in offene Räume laufen.','Bälle, Hütchen, Leibchen',10,'Feld mit zwei Außenzonen; nach Balleroberung Raum nutzen.','Feldbreite nutzen, Gegner aus der Mitte locken.'],
['Pass & Verlagerung','Raumverhalten','Eine enge Spielsituation auf die freie Seite verlagern.','Bälle, Leibchen, Hütchen',10,'Spiel auf zwei Breitenzonen; erfolgreiche Verlagerung belohnen.','Andere Seite sehen, freien Fuß anspielen.'],
['Steilpass & Abschluss','Torschuss','Tiefenlauf erkennen und Torabschluss vorbereiten.','Bälle, Hütchen, 2 Tore',10,'Freien Spieler in die Tiefe schicken und Abschluss suchen.','Timing des Passes und Blickkontakt beachten.'],
['Pass & Weg','Passspiel','Nach dem Pass sofort nachrücken.','Hütchen, Bälle',10,'Dreiergruppen passen und bewegen sich auf eine neue Position.','Nach dem Pass in Bewegung bleiben.'],
['Freier Spieler','Raumverhalten','Freie Mitspieler erkennen statt dem Ball hinterherzulaufen.','Bälle, Leibchen',10,'Überzahl schaffen; Spieler soll freie Anspielstation wählen.','Kopf heben, Abstand zwischen Spielern halten.'],
['Räume öffnen','Raumverhalten','Gegner locken und den freien Raum bespielen.','Hütchen, Bälle, Leibchen',10,'Zwei kleine Felder verbinden und Seite wechseln.','Abstand halten, freie Bahn erkennen.'],
['Breit & tief','Raumverhalten','Spielfeld breit halten und Tiefe anbieten.','Bälle, Hütchen',10,'Angreifer besetzen breite und tiefe Positionen.','Ballführenden Spieler durch gute Position unterstützen.'],
['3 gegen 1 – freie Seite','Überzahl','Überzahl schnell nutzen.','Bälle, Leibchen, Hütchen',10,'3 Angreifer spielen gegen 1 Verteidiger.','Blick auf freien Raum, sauberer erster Kontakt.'],
['Freie Bahn','Dribbling','Offenen Raum erkennen und mit Ball durchbrechen.','Hütchen, Bälle',10,'Dribbelkorridore und kleine Tore markieren.','Freien Korridor wählen, Tempowechsel einsetzen.'],
['Freies Einstimmen','Aufwärmen','Jedes Kind bekommt viele Ballkontakte.','Ein Ball pro Kind, Hütchen',10,'Freies Feld; alle bewegen sich mit Ball.','Freude am Ball, vielfältige Bewegungen.']
].map((x,i)=>({id:'ex'+(i+1),name:x[0],category:x[1],description:x[2],equipment:x[3],minutes:x[4],setup:x[5],coaching:x[6],age:'U6–U10',url:'',favorite:i<5}));
const PRESSURE_CHALLENGE={id:'ex-challenge-3v3',name:'3 gegen 3 – Raus aus der Druckzone',category:'Spielform',description:'Im 3 gegen 3 aus einer engen Druckzone lösen. Mit Punkten und kurzen Zeitlimits als Challenge spielen.',equipment:'Bälle, Leibchen, Hütchen, 2 kleine Tore',minutes:12,setup:'Ein übersichtliches kleines Spielfeld und eine Druckzone markieren. Drei Angreifer versuchen kontrolliert aus der Zone zu spielen. Drei Verteidiger erobern den Ball; nach kurzen Spielrunden die Rollen wechseln.',coaching:'Freie Seite erkennen, Gegner binden, mutige Richtungswechsel. Kurze Durchgänge statt langer Wartezeiten.',age:'U7–U10',url:'',imageUrl:'',favorite:true,challenge:'pressure-3v3'};
EX.push({...PRESSURE_CHALLENGE});
const sessionsSeed=[
['2026-09-15','Pass statt unnötig dribbeln',26,4,['ex1','ex5','ex6','ex2'],4],
['2026-09-17','Wenn es eng ist – andere Seite!',23,4,['ex1','ex7','ex8','ex9'],4],
['2026-09-21','Breite & Freie Räume',24,4,['ex1','ex10','ex11','ex12'],4],
['2026-09-28','Breit machen & freie Mitspieler erkennen',21,3,['ex1','ex13','ex14','ex15'],4],
['2026-10-01','Steilpass & Entscheidung',24,4,['ex1','ex2','ex3','ex4'],4]
].map(([date,theme,count,gcount,exerciseIds,stationCount],i)=>({id:'seed'+i,date,theme,headcount:count,groupCount:gcount,stationCount,exerciseIds,stationCoaches:['Trainer A','Trainer B','Trainer C','Trainer D'],status:'imported',completedIds:[],start:'17:05',warm:10,welcome:3,stationMinutes:10,breakMinutes:2,finalMinutes:16,availableCoaches:['Trainer C','Trainer A','Trainer B','Trainer D'],attendance:null,overrides:{}}));
function fresh(){let players=Array.from({length:24},(_,i)=>({id:'p'+(i+1),name:`Kind ${String(i+1).padStart(2,'0')}`,baseGroup:GROUPS[Math.floor(i/6)]}));const coaches=['Trainer C','Trainer A','Trainer B','Trainer D','Trainer E','Trainer F','Trainer G'];return {team:'SC Marchtrenk',age:'U7',players,coaches,exercises:EX,sessions:sessionsSeed,current:{id:'current',date:nextTrainingDate(),theme:'Freie Räume & Entscheidung',status:'draft',start:'17:05',warm:10,welcome:3,stationMinutes:10,breakMinutes:2,finalMinutes:16,groupCount:4,stationCount:4,exerciseIds:['ex1','ex2','ex3','ex4'],stationCoaches:['Trainer A','Trainer B','Trainer C','Trainer D'],availableCoaches:['Trainer A','Trainer B','Trainer C','Trainer D'],attendance:Object.fromEntries(players.map(p=>[p.id,true])),overrides:{},completedIds:[],currentRound:0}}}
function load(){try{let s=localStorage.getItem(KEY);if(s){const x=JSON.parse(s);if(x&&Array.isArray(x.players)&&Array.isArray(x.exercises)&&x.current&&Array.isArray(x.sessions))return x;}}catch(e){}return fresh()}
let data=load();
// Add only the newly introduced drill; never reset or replace a coach's existing local data.
if(!data.exercises.some(x=>x.id===PRESSURE_CHALLENGE.id)){
 data.exercises.push({...PRESSURE_CHALLENGE});
 try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}
}
const ui={view:'home',filter:'Alle',query:'',squadTab:'attendance',planTab:'plan',liveFocus:false,modal:null,chosenStation:0,historyId:null,balanceMoves:[],timer:600,running:false,timerStamp:0,timerSavedAt:0,toastId:null};
function validState(x){return !!(x&&Array.isArray(x.players)&&Array.isArray(x.exercises)&&x.current&&Array.isArray(x.sessions))}
function recoveryAvailable(){try{return validState(JSON.parse(localStorage.getItem(RECOVERY_KEY)||'null'))}catch(e){return false}}
function save(){
  try{
    const previous=localStorage.getItem(KEY), next=JSON.stringify(data);
    if(previous&&previous!==next){
      try{if(validState(JSON.parse(previous)))localStorage.setItem(RECOVERY_KEY,previous)}catch(e){}
    }
    localStorage.setItem(KEY,next);
  }catch(e){notify('Lokales Speichern fehlgeschlagen. Bitte Speicherplatz prüfen und JSON-Backup erstellen.')}
}
function attendanceSignature(s=data.current){return String(s.date||'')+'|'+data.players.map(p=>String(p.id)+':'+(s.attendance?.[p.id]===false?'0':'1')).sort().join('|')}
function attendanceConfirmed(s=data.current){return s.attendanceConfirmedSignature===attendanceSignature(s)}
function timerCheckpoint(){
  try{localStorage.setItem(TIMER_KEY,JSON.stringify({date:data.current.date,round:data.current.currentRound||0,remaining:ui.timer,running:ui.running,at:Date.now()}))}catch(e){}
}
function restoreTimer(){
  try{
    const state=JSON.parse(localStorage.getItem(TIMER_KEY)||'null');
    if(!state||state.date!==data.current.date||state.round!==(data.current.currentRound||0))return;
    const duration=data.current.stationMinutes*60;
    const remaining=Number(state.remaining);
    if(!Number.isFinite(remaining)||remaining<0||remaining>duration)return;
    const elapsed=state.running?Math.max(0,Math.floor((Date.now()-state.at)/1000)):0;
    ui.timer=Math.max(0,remaining-elapsed);
    ui.running=Boolean(state.running)&&ui.timer>0;
    ui.timerStamp=Date.now();
  }catch(e){}
}
function notify(msg){let t=qs('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(ui.toastId);ui.toastId=setTimeout(()=>t.classList.remove('show'),2600)}
function edit(mut){mut();save();render()}
const btn=(label,act,kind='btn',extra='')=>`<button type="button" class="${kind}" data-act="${act}" ${extra}>${label}</button>`;
function tSpan(s){return esc(s)}
function presentPlayers(s=data.current){return data.players.filter(p=>s.attendance?.[p.id]!==false)}
const assignedGroup=(p,s=data.current)=>s.overrides?.[p.id]||p.baseGroup;
function selectedGroups(s=data.current){return GROUPS.slice(0,Math.max(1,Number(s.groupCount)||4))}
function groupPlayers(group,s=data.current){return presentPlayers(s).filter(p=>assignedGroup(p,s)===group)}
function visibleStations(s=data.current){return Math.max(1,Math.min(4,Number(s.stationCount)||4))}
function rotation(s=data.current){let count=visibleStations(s),groups=selectedGroups(s);return Array.from({length:count},(_,r)=>({round:r+1,cells:groups.map((group,g)=>({group,index:(g+r)%count,exercise:exercise(s.exerciseIds[(g+r)%count])}))}))}
function exercise(eid){return data.exercises.find(e=>e.id===eid)||{id:'',name:'Übung auswählen',description:'Noch keine Übung zugewiesen',minutes:10,category:'Offen'}}
function doneCount(eid){return data.sessions.filter(s=>s.status==='done'&&s.completedIds?.includes(eid)).length+(data.current.status==='done'&&data.current.completedIds?.includes(eid)?1:0)}
function plannedCount(eid){return [...data.sessions,data.current].filter(s=>(s.exerciseIds||[]).includes(eid)).length}
function dateAndTime(){let s=data.current;return `${localDate(s.date)} · ${s.start} Uhr`}
function totalDuration(s=data.current){return Number(s.warm)+Number(s.welcome)+visibleStations(s)*Number(s.stationMinutes)+(visibleStations(s)-1)*Number(s.breakMinutes)+Number(s.finalMinutes)}
function timetable(s=data.current){let start=s.start,parts=[{time:start,name:'Freies Einstimmen',minutes:+s.warm}];start=addMin(start,+s.warm);parts.push({time:start,name:'Begrüßung & Gruppen',minutes:+s.welcome});start=addMin(start,+s.welcome);parts.push({time:start,name:`Stationen · ${visibleStations(s)} Runden`,minutes:visibleStations(s)*(+s.stationMinutes)+(visibleStations(s)-1)*(+s.breakMinutes)});start=addMin(start,parts[2].minutes);parts.push({time:start,name:'Abschlussspiele',minutes:+s.finalMinutes});return parts}
function isCoachesValid(s=data.current){return s.availableCoaches.length>=s.stationCount&&s.stationCoaches.slice(0,s.stationCount).every((c,i)=>c&&s.availableCoaches.includes(c)&&s.stationCoaches.indexOf(c)===i)}
function base(){return `<div class="app"><header class="topbar"><div class="brand"><div class="logo">${ic('ball',26)}</div><div><div class="brand-title">${PUBLIC_BRAND.slice(0,-2)}<span>${PUBLIC_BRAND.slice(-2)}</span></div><div class="subbrand">TRAINING. TEAM. SPIELTAG.</div></div></div><div class="top-actions"><button class="icon-btn" data-act="settings" aria-label="Daten und Einstellungen">${ic('more',20)}</button></div></header><div id="screen">${screen()}</div><div class="footer-space"></div></div><nav class="nav" aria-label="Hauptnavigation">${[['home','home','Übersicht'],['library','book','Übungen'],['planner','calendar','Planer'],['squad','users','Team'],['history','chart','Historie']].map(([v,ico,l])=>`<button class="${ui.view===v?'active':''}" data-act="nav" data-value="${v}" aria-label="${l}">${ic(ico,21)}<span>${l}</span></button>`).join('')}</nav>`}
function head(title,kicker,sub='',right=''){return `<div class="headline"><div><div class="eyebrow">${esc(kicker)}</div><h1>${title}</h1>${sub?`<p class="lead">${sub}</p>`:''}</div>${right||''}</div>`}
function home(){const s=data.current,plandone=data.exercises.filter(e=>doneCount(e.id)>0).length;return `${head('Deine Trainingszentrale','SC MARCHTRENK · '+esc(data.age),'Sammeln. Planen. Trainieren. Besser werden.',btn(ic('plus')+' Neue Idee','add-exercise','btn'))}<div class="grid cols-4"><div class="stat"><div class="number">${data.exercises.length}</div><div class="statlabel">Übungen in Bibliothek</div><div class="up">${ic('book',13)} Für deine Trainings</div></div><div class="stat"><div class="number">${data.sessions.length}</div><div class="statlabel">Importierte Vorbereitungen</div><div class="up">${ic('calendar',13)} Als Vorlagen nutzbar</div></div><div class="stat"><div class="number">${presentPlayers().length}</div><div class="statlabel">Aktuell anwesende Kinder</div><div class="up">${ic('users',13)} ${data.players.length} im Kader</div></div><div class="stat"><div class="number">${plandone}</div><div class="statlabel">Nachweislich durchgeführt</div><div class="up">${ic('check',13)} Nach Training bestätigen</div></div></div><div class="grid cols-2 section-gap"><div class="card glow"><div class="between"><span class="hero-eyebrow">NÄCHSTE TRAININGSEINHEIT</span><span class="badge">${s.status==='done'?'Abgeschlossen':'IN PLANUNG'}</span></div><div class="hero-date">${dateAndTime()}</div><div class="hero-title">${esc(s.theme)}</div><p class="hero-desc">${presentPlayers().length} Kinder · ${s.availableCoaches.length} Trainer · ${visibleStations(s)} Stationen · ${totalDuration()} Minuten</p><div class="hero-foot"><div class="avatar-line"><div class="avatars">${s.availableCoaches.slice(0,4).map(n=>`<span class="avatar">${esc(n[0])}</span>`).join('')}</div>${esc(s.availableCoaches.slice(0,3).join(', '))}</div>${btn('Training planen '+ic('arrow'),'open-planner','btn')}</div></div><div class="card"><div class="card-title"><h2>Dein Trainingsablauf</h2><span class="badge mutedbadge">${totalDuration()} Min.</span></div>${timetable().map(x=>`<div class="schedule-row"><div class="schedule-index">${x.time}</div><div class="schedule-main"><div class="schedule-name">${esc(x.name)}</div><div class="schedule-sub">${x.minutes} Minuten</div></div>${ic('check',15)}</div>`).join('')}</div></div><div class="grid cols-2 section-gap"><div class="card"><div class="card-title"><h2>${ic('sparkles',20)} Trainingstipps</h2><span class="badge mutedbadge">DEMO-LOGIK</span></div><p class="muted smalltxt">Aus den importierten Vorbereitungen erkennt SpielfeldIQ, welche Übungen du schon oft eingeplant hast und welche noch ungenutzt sind.</p><div class="divider"></div>${data.exercises.filter(e=>!data.current.exerciseIds.includes(e.id)).sort((a,b)=>plannedCount(a.id)-plannedCount(b.id)).slice(0,2).map(e=>`<div class="list-row"><div class="exercise-icon">${ic('ball')}</div><div class="schedule-main"><div class="schedule-name">${esc(e.name)}</div><div class="schedule-sub">Bisher ${plannedCount(e.id)}× eingeplant · ${doneCount(e.id)}× bestätigt</div></div>${btn(ic('plus'),'add-to-plan','ghost small',`data-id="${esc(e.id)}"`)}</div>`).join('')}${btn('Übungen entdecken '+ic('arrow'),'nav','ghost small section-gap','data-value="library"')}</div><div class="card"><div class="card-title"><h2>Zuletzt vorbereitet</h2>${btn('Alle anzeigen '+ic('chevron'),'nav','ghost small','data-value="history"')}</div>${data.sessions.slice().reverse().slice(0,3).map(s=>`<div class="list-row"><div class="schedule-index">${fmtShort(s.date)}</div><div class="schedule-main"><div class="schedule-name">${esc(s.theme)}</div><div class="schedule-sub">${s.headcount} Kinder · ${s.stationCount} Stationen · Vorbereitung</div></div>${btn(ic('arrow'),'duplicate','ghost small',`data-id="${s.id}" title="Als Vorlage übernehmen"`)}</div>`).join('')}<div class="desktop-note">Historische Dokumente gelten nicht automatisch als durchgeführte Trainings.</div></div></div>`}
function challengeAction(ex,source='library',small=false){
 if(ex.challenge!=='pressure-3v3')return '';
 const back=source==='live'?'https://marinkarimovic.github.io/coachflow/?view=planner&tab=live':source==='planner'?'https://marinkarimovic.github.io/coachflow/?view=planner&tab=plan':'https://marinkarimovic.github.io/coachflow/?view=library';
 const url='https://marinkarimovic.github.io/funino-challenge/?seconds=45&return='+encodeURIComponent(back);
 return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="btn secondary ${small?'small':''} challenge-link" aria-label="Druckzonen-Challenge für ${esc(ex.name)} öffnen">${ic('play',15)} Challenge starten ↗</a>`;
}
function library(){let q=ui.query.toLocaleLowerCase('de'),f=ui.filter;let list=data.exercises.filter(e=>(f==='Alle'||(f==='Favoriten'?e.favorite:e.category===f))&&(`${e.name} ${e.category} ${e.description} ${e.equipment}`.toLocaleLowerCase('de').includes(q)));const cats=['Alle','Favoriten',...new Set(data.exercises.map(e=>e.category))];return `${head('Übungsbibliothek','DEINE IDEEN · DEIN WISSEN','Instagram-Links, eigene Ideen und bewährte Übungen an einem Ort.',btn(ic('plus')+' Übung anlegen','add-exercise','btn'))}<div class="card"><div class="searchbar">${ic('search')}<input id="exercise-search" placeholder="Übung, Thema oder Material suchen ..." value="${esc(ui.query)}" aria-label="Übungen durchsuchen"/></div><div class="pillrow section-gap">${cats.map(c=>`<button type="button" class="pill opt ${f===c?'selected':''}" data-act="filter" data-value="${esc(c)}">${esc(c)}</button>`).join('')}</div></div><div class="section-title"><span>${list.length} Übungen gefunden</span><span class="muted smalltxt">${data.exercises.length} insgesamt</span></div><div class="grid cols-half">${list.map(e=>`<div class="exercise"><div class="exercise-icon">${ic('ball',23)}</div><div class="exercise-body"><div class="between"><span class="badge mutedbadge">${esc(e.category)}</span>${btn(e.favorite?'★':'☆','favorite','ghost small',`data-id="${esc(e.id)}" title="Favorit ändern"`)}</div><h3 style="margin-top:9px">${esc(e.name)}</h3><div class="media-preview">${exerciseMedia(e,true)}</div><p class="muted smalltxt">${esc(e.description)}</p><div class="detailset"><span class="pill">${ic('clock',13)} ${e.minutes} Min.</span><span class="pill">${esc(e.age||'U6–U10')}</span>${e.url?`<span class="pill">${ic('link',13)} Video-Link</span>`:''}${e.challenge==='pressure-3v3'?`<span class="pill cyan">${ic('play',13)} Interaktive Challenge</span>`:''}</div><div class="exercise-foot"><span class="tiny">${plannedCount(e.id)}× geplant · ${doneCount(e.id)}× durchgeführt</span><div class="inline">${btn('Details','exercise-detail','ghost small',`data-id="${esc(e.id)}"`)}${btn(ic('plus')+' Plan','add-to-plan','btn small',`data-id="${esc(e.id)}"`)}</div></div></div></div>`).join('')}</div>${list.length?'':'<div class="empty">Keine passenden Übungen gefunden. Du kannst jederzeit eine neue Übung anlegen.</div>'}<div class="section-title">Weitere Übungsideen entdecken</div><div class="notice green">${ic('info')} Externe Übungsbibliotheken öffnen sich als Link. Fremde Videos oder Abbildungen werden nicht ungefragt kopiert.</div><div class="source-list"><a href="https://training-service.fussball.de/trainer/f-juniorin/training-online/trainingseinheiten/" target="_blank" rel="noopener noreferrer"><strong>DFB Training Online · F-Jugend</strong><span>Öffnen ↗</span></a><a href="https://training-service.fussball.de/trainer/bambinie/training-online/trainingseinheiten/" target="_blank" rel="noopener noreferrer"><strong>DFB Training Online · Bambini</strong><span>Öffnen ↗</span></a><a href="https://www.fifatrainingcentre.com/en/" target="_blank" rel="noopener noreferrer"><strong>FIFA Training Centre</strong><span>Öffnen ↗</span></a><a href="https://www.uefa.com/grassroots-coaching/" target="_blank" rel="noopener noreferrer"><strong>UEFA Grassroots</strong><span>Öffnen ↗</span></a></div>`}
function planner(){const s=data.current;const valid=isCoachesValid();return `${head('Trainingsplaner','TRAINING VORBEREITEN',esc(localDate(s.date))+' · '+totalDuration()+' Minuten',btn(ic('print')+' PDF erstellen','print','btn subtle'))}<div class="tabs" style="margin-bottom:15px">${[['plan','Planung'],['rotation','Rotation'],['live','Live-Training']].map(([x,t])=>`<button class="tab ${ui.planTab===x?'active':''}" data-act="plan-tab" data-value="${x}">${t}</button>`).join('')}</div>${ui.planTab==='plan'?planDetail(s,valid):ui.planTab==='rotation'?rotationView(s,valid):liveView(s)}`}
function planDetail(s,valid){return `<div class="grid cols-2"><div class="card"><div class="card-title"><h2>Rahmendaten</h2><span class="badge mutedbadge">${esc(data.age)}</span></div><div class="field"><label>Trainingsthema</label><input id="theme" class="input" value="${esc(s.theme)}"/></div><div class="splitfields date-time-fields section-gap"><div class="field"><label>Datum</label><input id="session-date" type="date" class="input" value="${esc(s.date)}"/></div><div class="field"><label>Beginn</label><input id="session-start" type="time" class="input" value="${esc(s.start)}"/></div></div><div class="threefields section-gap"><div class="field"><label>Stationen</label><select id="station-count" class="input">${[2,3,4].map(n=>`<option value="${n}" ${+s.stationCount===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Gruppen</label><select id="group-count" class="input">${[2,3,4].map(n=>`<option value="${n}" ${+s.groupCount===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Min./Station</label><select id="station-minutes" class="input">${[8,10,12,15].map(n=>`<option value="${n}" ${+s.stationMinutes===n?'selected':''}>${n} Min.</option>`).join('')}</select></div></div><div class="splitfields section-gap"><div class="field"><label>Wechselpause</label><select id="break-minutes" class="input">${[0,1,2,3,4].map(n=>`<option value="${n}" ${+s.breakMinutes===n?'selected':''}>${n} Min.</option>`).join('')}</select></div><div class="field"><label>Abschlussspiel</label><select id="final-minutes" class="input">${[10,12,15,16,18,20].map(n=>`<option value="${n}" ${+s.finalMinutes===n?'selected':''}>${n} Min.</option>`).join('')}</select></div></div><div class="divider"></div><div class="between"><span class="muted smalltxt">Geplantes Trainingsende</span><strong>${addMin(s.start,totalDuration())}</strong></div><div class="between section-gap"><span class="muted smalltxt">Kinder anwesend</span>${btn(presentPlayers().length+' · Anwesenheit bearbeiten '+ic('arrow'),'nav','ghost small','data-value="squad"')}</div><div class="between section-gap"><span class="muted smalltxt">Trainer verfügbar</span><strong>${s.availableCoaches.length}</strong></div>${!valid?`<div class="notice section-gap">${ic('info')} Nicht alle Stationen sind eindeutig mit einem verfügbaren Trainer besetzt. Bitte Zuordnung prüfen oder Stationen reduzieren.</div>`:''}${s.groupCount>s.stationCount?`<div class="notice red section-gap">${ic('info')} Mehr Gruppen als Stationen: gleichzeitige Stationsbesuche nicht konfliktfrei möglich.</div>`:''}${s.availableCoaches.length<s.stationCount?`<div class="section-gap">${btn('Stationen an Trainerzahl anpassen','adjust-stations','btn secondary small')}</div>`:''}</div><div class="card"><div class="card-title"><h2>Trainingsablauf</h2><span class="badge mutedbadge">${totalDuration()} Minuten</span></div>${timetable(s).map((x,i)=>`<div class="schedule-row"><div class="schedule-index">${esc(x.time)}</div><div class="schedule-main"><div class="schedule-name">${esc(x.name)}</div><div class="schedule-sub">${x.minutes} Min.</div></div><span class="pill">${i+1}</span></div>`).join('')}<div class="divider"></div><div class="notice green">${ic('info')} Änderungen werden auf diesem Gerät automatisch gespeichert. Export über die Einstellungen möglich.</div></div></div><div class="section-title"><span>Stationen & Trainer</span>${btn(ic('sparkles')+' Ideen vorschlagen','suggest','btn secondary small')}</div><div class="grid cols-half">${Array.from({length:visibleStations(s)},(_,i)=>{let e=exercise(s.exerciseIds[i]);return `<div class="card flat"><div class="between"><span class="phase-tag">Station ${i+1}</span><span class="badge mutedbadge">${s.stationMinutes} Min.</span></div><h2 style="margin:8px 0">${esc(e.name)}</h2><p class="muted smalltxt">${esc(e.description)}</p>${challengeAction(e,'planner',true)}<div class="detailset"><span class="pill">${ic('ball',13)} ${esc(e.category)}</span><span class="pill">${ic('clock',13)} ${s.stationMinutes} Min.</span></div><div class="divider"></div><div class="between"><div class="field" style="flex:1"><label>Verantwortlicher Trainer</label><select class="input" data-coach-slot="${i}"><option value="">Nicht besetzt</option>${data.coaches.map(c=>`<option value="${esc(c)}" ${s.stationCoaches[i]===c?'selected':''}>${esc(c)}${!s.availableCoaches.includes(c)?' (abwesend)':''}</option>`).join('')}</select></div>${btn(ic('swap'),'station-choose','ghost small',`data-slot="${i}" title="Übung ersetzen"`)}</div></div>`}).join('')}</div><div class="inline section-gap">${btn(ic('shuffle')+' Rotationsplan anzeigen','plan-tab','btn','data-value="rotation"')}${btn(ic('print')+' Trainingsblatt','print','btn subtle')}</div>`}
function rotationView(s,valid){let groups=selectedGroups(s),rows=rotation(s);return `<div class="card"><div class="card-title"><h2>Automatische Rotation</h2><span class="badge">${groups.length} Gruppen · ${visibleStations(s)} Runden</span></div><p class="muted smalltxt">Jede Gruppe besucht jede Station einmal. Bei weniger Gruppen als Stationen bleibt pro Runde eine Station frei.</p>${groups.length>visibleStations(s)?`<div class="notice red section-gap">Bitte die Anzahl der Gruppen auf maximal ${visibleStations(s)} reduzieren.</div>`:''}${!valid?`<div class="notice section-gap">${ic('info')} Achtung: Trainerzuordnung ist nicht vollständig. Bitte im Planer klären.</div>`:''}<div class="rot-wrap section-gap"><table class="rot"><thead><tr><th>Runde</th>${groups.map(g=>`<th><span class="rotation-dot" style="background:${COLORS[g]}"></span>${g}<small>${groupPlayers(g,s).length} Kinder</small></th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${r.round}</strong><small>${addMin(s.start,+s.warm+(+s.welcome)+(r.round-1)*(+s.stationMinutes+(+s.breakMinutes)))}</small></td>${r.cells.map(c=>`<td><strong>${esc(c.exercise.name)}</strong><small>Station ${c.index+1} · ${esc(s.stationCoaches[c.index]||'ohne Trainer')}</small></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="inline section-gap">${btn(ic('print')+' PDF erstellen','print','btn')}${btn(ic('users')+' Gruppen anpassen','nav','ghost','data-value="squad"')}</div></div><div class="section-title">Belegung im Überblick</div><div class="grid cols-half">${Array.from({length:visibleStations(s)},(_,i)=>`<div class="card flat"><span class="phase-tag">Station ${i+1}</span><h3>${esc(exercise(s.exerciseIds[i]).name)}</h3><p class="muted smalltxt">Trainer: ${esc(s.stationCoaches[i]||'Nicht besetzt')}</p><div class="pillrow section-gap">${rows.map(r=>{let g=r.cells.find(c=>c.index===i)?.group;return `<span class="pill">R${r.round}: ${esc(g||'frei')}</span>`}).join('')}</div></div>`).join('')}</div>`}
function liveView(s){let r=Math.min(s.currentRound||0,visibleStations(s)-1),rows=rotation(s),current=rows[r],done=s.completedIds||[];return `<div class="grid cols-2"><div class="timer-card"><div class="eyebrow" style="justify-content:center">LIVE-TRAINING · RUNDE ${r+1}/${visibleStations(s)}</div><div class="timer-display" id="timer-value">${timeString(ui.timer)}</div><p class="muted smalltxt">Countdown für die aktuelle Stationsrunde</p><div class="timer-buttons">${btn(ic(ui.running?'pause':'play')+' '+(ui.running?'Pause':'Start'),'timer-toggle','btn')}${btn(ic('reset')+' Reset','timer-reset','btn subtle')}</div><div class="progress section-gap"><div id="timer-progress" style="width:${Math.max(0,Math.min(100,ui.timer/(s.stationMinutes*60)*100))}%"></div></div><div class="between section-gap">${btn(ic('chevron')+' Zurück','prev-round','ghost small',r===0?'disabled':'')}${btn('Nächste Runde '+ic('arrow'),'next-round','btn small',r>=visibleStations(s)-1?'disabled':'')}</div></div><div class="card"><div class="card-title"><h2>Aktuelle Stationsbelegung</h2><span class="badge mutedbadge">${visibleStations(s)} Stationen</span></div>${current.cells.map(c=>`<div class="schedule-row"><span class="pill" style="min-width:72px;border-color:${COLORS[c.group]};color:${COLORS[c.group]}">${esc(c.group)}</span><div class="schedule-main"><div class="schedule-name">${esc(c.exercise.name)}</div><div class="schedule-sub">Station ${c.index+1} · ${esc(s.stationCoaches[c.index]||'nicht besetzt')}</div>${challengeAction(c.exercise,'live',true)}</div></div>`).join('')}<div class="notice blue section-gap">${ic('info')} Der Timer läuft nur solange die App geöffnet und aktiv ist. Ein gesperrtes iPhone kann die Aktualisierung verzögern.</div></div></div><div class="section-title"><span>Übungen als durchgeführt markieren</span><span class="muted smalltxt">${done.length}/${visibleStations(s)}</span></div><div class="card flat">${s.exerciseIds.slice(0,visibleStations(s)).map((eid,i)=>`<div class="checkline"><input type="checkbox" id="done-${i}" data-done-ex="${i}" ${done.includes(eid)?'checked':''}/><label for="done-${i}"><strong>${esc(exercise(eid).name)}</strong><div class="tiny">Station ${i+1} · ${esc(s.stationCoaches[i]||'ohne Trainer')}</div></label></div>`).join('')}<div class="inline section-gap">${btn(ic('check')+' Training abschließen','finish','btn')}${btn('Zur Planung','plan-tab','ghost','data-value="plan"')}</div><div class="tip section-gap">Nur bestätigte Übungen werden in der Trainingshistorie als tatsächlich durchgeführt gezählt. Die ursprüngliche Planung bleibt erhalten.</div></div>`}
function timeString(sec){let s=Math.max(0,Math.floor(sec));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function suggestBalance(){let groups=selectedGroups(),pool={};groups.forEach(g=>pool[g]=[]);let outsiders=[];presentPlayers().forEach(p=>{let g=assignedGroup(p);if(pool[g])pool[g].push(p);else outsiders.push(p)});let moves=[];for(const p of outsiders){let smallest=groups.slice().sort((a,b)=>pool[a].length-pool[b].length)[0];moves.push({pid:p.id,from:assignedGroup(p),to:smallest});pool[smallest].push(p)};let safety=0;while(safety++<50){let asc=groups.slice().sort((a,b)=>pool[a].length-pool[b].length);let lo=asc[0],hi=asc[asc.length-1];if(pool[hi].length-pool[lo].length<=1)break;let p=pool[hi].pop();pool[lo].push(p);moves.push({pid:p.id,from:hi,to:lo});}return moves}
function squad(){let s=data.current,tab=ui.squadTab;return `${head('Mein Team','KADER & GRUPPEN',esc(data.team)+' · '+esc(data.age)+' · '+data.players.length+' Kinder',btn(ic('plus')+' Kind hinzufügen','add-player','btn'))}<div class="grid cols-3 compact-stats"><div class="stat"><div class="number">${data.players.length}</div><div class="statlabel">Kinder im Kader</div></div><div class="stat"><div class="number">${presentPlayers().length}</div><div class="statlabel">Heute anwesend</div></div><div class="stat"><div class="number">${s.availableCoaches.length}</div><div class="statlabel">Trainer verfügbar</div></div></div><div class="tabs section-gap">${[['attendance','Anwesenheit'],['groups','Stammgruppen'],['coaches','Trainer']].map(([v,l])=>`<button class="tab ${tab===v?'active':''}" data-act="squad-tab" data-value="${v}">${l}</button>`).join('')}</div>${tab==='attendance'?attendance():tab==='groups'?roster():coaches()}`}
function attendance(){let s=data.current,moves=suggestBalance(),outOf=presentPlayers().filter(p=>!selectedGroups(s).includes(assignedGroup(p)));return `<div class="grid cols-2 section-gap"><div class="card"><div class="card-title"><h2>Anwesenheit fürs nächste Training</h2>${btn('Alle anwesend','all-present','ghost small')}</div><p class="muted smalltxt" style="margin-bottom:12px">Die Zuordnung zur Stammgruppe bleibt bei Tagesänderungen erhalten.</p>${data.players.map(p=>`<div class="player-row ${s.attendance[p.id]===false?'absent':''}"><input type="checkbox" id="att-${p.id}" data-attendance="${p.id}" ${s.attendance[p.id]!==false?'checked':''}/><div class="player-circle">${esc(p.name.slice(0,2).toUpperCase())}</div><label for="att-${p.id}" class="name">${esc(p.name)}</label><span class="pill" style="border-color:${COLORS[p.baseGroup]};color:${COLORS[p.baseGroup]}">${p.baseGroup}</span></div>`).join('')}</div><div class="stack"><div class="card"><div class="card-title"><h2>Tagesgruppen</h2><span class="badge">${presentPlayers().length} Kinder</span></div>${selectedGroups(s).map(g=>`<div class="schedule-row"><span class="rotation-dot" style="background:${COLORS[g]}"></span><div class="schedule-main"><strong>${g}</strong><div class="tiny">${groupPlayers(g,s).map(p=>esc(p.name)).join(', ')||'Keine Kinder'}</div></div><span class="badge mutedbadge">${groupPlayers(g,s).length}</span></div>`).join('')}${outOf.length?`<div class="notice section-gap">${outOf.length} Kind(er) sind einer gerade ausgeblendeten Gruppe zugeordnet. Bitte umteilen oder Gruppenanzahl erhöhen.</div>`:''}<div class="divider"></div>${btn(ic('shuffle')+' Ausgleich vorschlagen','balance','btn secondary')}${btn('Tagesgruppen bearbeiten','squad-tab','ghost section-gap','data-value="groups"')}</div><div class="notice green">${ic('check')} Die Stammgruppen bleiben bestehen. Nur für diese Trainingseinheit vorgenommene Umbesetzungen werden im Plan gespeichert.</div></div></div>`}
function roster(){let s=data.current;return `<div class="notice green section-gap">${ic('info')} Links: dauerhafte Stammgruppe. Rechts: optional abweichende Tagesgruppe. Änderungen rechts betreffen nur das nächste Training.</div><div class="grid cols-half roster-grid section-gap">${data.players.map(p=>`<div class="player-row card flat roster-card" style="padding:12px"><div class="player-circle">${esc(p.name.slice(0,2).toUpperCase())}</div><div class="schedule-main"><div class="schedule-name">${esc(p.name)}</div><div class="tiny">${s.attendance[p.id]===false?'Heute abwesend':'Heute anwesend'}</div></div><div class="group-selects"><div class="field"><label>Stamm</label><select class="input" data-base-group="${p.id}" style="padding:6px;min-height:34px;font-size:11px">${GROUPS.map(g=>`<option ${p.baseGroup===g?'selected':''}>${g}</option>`).join('')}</select></div><div class="field"><label>Heute</label><select class="input" data-day-group="${p.id}" style="padding:6px;min-height:34px;font-size:11px">${GROUPS.map(g=>`<option ${assignedGroup(p,s)===g?'selected':''}>${g}</option>`).join('')}</select></div></div></div>`).join('')}</div>`}
function coaches(){let s=data.current;return `<div class="grid cols-2 section-gap"><div class="card"><div class="card-title"><h2>Verfügbare Trainer</h2>${btn(ic('plus')+' Trainer','add-coach','ghost small')}</div>${data.coaches.map(n=>`<div class="coach-row"><input id="coach-${esc(n)}" type="checkbox" data-coach-avail="${esc(n)}" ${s.availableCoaches.includes(n)?'checked':''}/><label for="coach-${esc(n)}" class="name" style="flex:1;font-weight:720">${esc(n)}</label><span class="badge ${s.availableCoaches.includes(n)?'':'mutedbadge'}">${s.availableCoaches.includes(n)?'Dabei':'Abwesend'}</span></div>`).join('')}</div><div class="card"><h2>Trainereinsatz</h2><p class="muted smalltxt section-gap">Ein Trainer kann im Standardmodell eine parallel laufende Station betreuen.</p><div class="divider"></div>${s.stationCoaches.slice(0,visibleStations(s)).map((n,i)=>`<div class="schedule-row"><div class="schedule-index">${i+1}.</div><div class="schedule-main"><strong>${esc(exercise(s.exerciseIds[i]).name)}</strong><div class="tiny">${esc(n||'Nicht besetzt')}</div></div>${s.availableCoaches.includes(n)?ic('check'):ic('info')}</div>`).join('')}${s.availableCoaches.length<visibleStations(s)?`<div class="notice section-gap">Weniger Trainer als parallele Stationen verfügbar. Nutze die Schaltfläche im Planer, um Stationen zu reduzieren.</div>`:''}${btn('Stationen bearbeiten '+ic('arrow'),'nav','ghost section-gap','data-value="planner"')}</div></div>`}
function history(){let all=[...data.sessions,...(data.current.status==='done'?[data.current]:[])].slice().sort((a,b)=>b.date.localeCompare(a.date));let confirmed=all.filter(x=>x.status==='done');return `${head('Trainingshistorie','DEIN TRAININGS-TAGEBUCH','Was war geplant, was wurde wirklich durchgeführt?',btn(ic('download')+' Datenexport','export','btn subtle'))}<div class="grid cols-3 compact-stats"><div class="stat"><div class="number">${all.length}</div><div class="statlabel">Dokumentierte Vorbereitungen</div></div><div class="stat"><div class="number">${confirmed.length}</div><div class="statlabel">Als durchgeführt bestätigt</div></div><div class="stat"><div class="number">${data.exercises.filter(e=>doneCount(e.id)>0).length}</div><div class="statlabel">Verschiedene Übungen ausgeführt</div></div></div><div class="notice blue section-gap">${ic('info')} Die fünf aus deinen Screenshots übernommenen Einheiten gelten als <strong>Vorbereitungen</strong>. Eine tatsächliche Durchführung wurde nicht behauptet. Ein Training wird erst durch deine Bestätigung gezählt.</div><div class="section-title">Deine bisherigen Trainings</div><div class="grid cols-half">${all.map(s=>`<div class="history-card"><div class="between"><div class="hdate">${esc(localDate(s.date))}</div><span class="badge ${s.status==='done'?'':'mutedbadge'}">${s.status==='done'?'Durchgeführt':'Vorbereitung'}</span></div><div class="htitle">${esc(s.theme)}</div><div class="pillrow"><span class="pill">${s.headcount??presentPlayers(s).length} Kinder</span><span class="pill">${s.groupCount} Gruppen</span><span class="pill">${s.stationCount} Stationen</span></div><div class="divider"></div><div class="tiny">${s.exerciseIds.slice(0,s.stationCount).map(eid=>esc(exercise(eid).name)).join(' · ')}</div><div class="inline section-gap">${btn(ic('swap')+' Als Vorlage','duplicate','btn small',`data-id="${esc(s.id)}"`)}${btn('Details','history-detail','ghost small',`data-id="${esc(s.id)}"`)}</div></div>`).join('')}</div><div class="section-title">Übungshäufigkeit</div><div class="card">${data.exercises.filter(e=>plannedCount(e.id)>0).sort((a,b)=>plannedCount(b.id)-plannedCount(a.id)).slice(0,8).map(e=>{let n=plannedCount(e.id);return `<div style="margin:10px 0"><div class="between smalltxt frequency-caption"><span>${esc(e.name)}</span><strong>${n}× geplant · ${doneCount(e.id)}× durchgeführt</strong></div><div class="progress" style="margin-top:5px"><div style="width:${Math.round(100*n/Math.max(1,...data.exercises.map(x=>plannedCount(x.id))))}%"></div></div></div>`}).join('')}</div>`}
function screen(){switch(ui.view){case'home':return home();case'library':return library();case'planner':return planner();case'squad':return squad();case'history':return history();default:return home()}}
function render(){document.body.classList.toggle('live-focused',ui.view==='planner'&&ui.planTab==='live'&&ui.liveFocus);qs('#app').innerHTML=base();renderModal();updatePrintable();window.CoachFlowFeatures?.mount?.();}
function renderModal(){let m=ui.modal;if(!m){qs('#modal-root').innerHTML='';return}let body='',title='';if(m.type==='add-exercise'){title='Neue Übung / Videoidee';body=`<form id="exercise-form" class="stack"><div class="field"><label>Name der Übung *</label><input class="input" name="name" placeholder="z. B. 3 gegen 3 – Druckzone" required maxlength="110"/></div><div class="field"><label>Instagram-, YouTube- oder Videolink (optional)</label><input class="input" name="url" type="url" placeholder="https://www.instagram.com/reel/..."/></div><div class="splitfields"><div class="field"><label>Kategorie</label><select class="input" name="category">${['Spielform','Dribbling','Passspiel','Überzahl','Raumverhalten','Torschuss','Koordination','Aufwärmen','Sonstiges'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Dauer (Minuten)</label><input class="input" type="number" min="1" max="90" value="10" name="minutes"/></div></div><div class="field"><label>Bild-URL (optional – eigenes oder freigegebenes Bild)</label><input type="url" class="input" name="imageUrl" placeholder="https://.../bild.jpg"/></div><div class="field"><label>Interaktive Trainer-Challenge (optional)</label><select class="input" name="challenge"><option value="">Keine Challenge</option><option value="pressure-3v3">FUNiño · Druckzonen-Challenge (Punkte + Zeit)</option></select><p class="tiny">Nur zu passenden Übungen hinzufügen: Die Challenge ist auf 3 gegen 3 in der Druckzone ausgelegt.</p></div><div class="field"><label>Beschreibung</label><textarea class="input" name="description" placeholder="Wie funktioniert die Übung?"></textarea></div><div class="field"><label>Material</label><input class="input" name="equipment" placeholder="Hütchen, Bälle, Tore ..."/></div><div class="field"><label>Aufbau / Ablauf</label><textarea class="input" name="setup" placeholder="Spielfeld, Regeln, Varianten ..."></textarea></div><div class="field"><label>Coaching-Punkte</label><textarea class="input" name="coaching" placeholder="Worauf sollten die Kinder achten?"></textarea></div><button type="submit" class="btn">${ic('save')} Übung speichern</button><div class="tip">Ein eingefügter Instagram-Link wird gespeichert. Videos werden in diesem Offline-Prototyp nicht heruntergeladen und nicht automatisch durch KI analysiert.</div></form>`}
else if(m.type==='exercise-detail'){let e=exercise(m.id);title=esc(e.name);body=`<div class="pillrow"><span class="badge">${esc(e.category)}</span><span class="pill">${e.minutes} Min.</span><span class="pill">${esc(e.age||'U6–U10')}</span></div>${exerciseMedia(e)}<p class="muted section-gap">${esc(e.description)}</p>${[['Aufbau & Ablauf',e.setup],['Material',e.equipment],['Coaching-Punkte',e.coaching]].map(([t,v])=>`<div class="details-block"><h3>${t}</h3><div>${esc(v||'Noch nicht hinterlegt.')}</div></div>`).join('')}<p class="tiny">${plannedCount(e.id)}× geplant · ${doneCount(e.id)}× als durchgeführt bestätigt</p><div class="inline section-gap">${e.url?`<a target="_blank" rel="noopener noreferrer" href="${esc(validUrl(e.url)||'#')}" class="btn subtle">${ic('external')} Video öffnen</a>`:''}${btn(ic('plus')+' Im Plan verwenden','add-to-plan','btn',`data-id="${esc(e.id)}"`)}${challengeAction(e)}${btn(ic('edit')+' Medien & Tools','edit-media','ghost',`data-id="${esc(e.id)}"`)}</div>`}
else if(m.type==='edit-media'){const e=exercise(m.id);title='Medien · '+esc(e.name);body=`<form id="media-form" class="stack" data-id="${esc(e.id)}"><div class="field"><label>Video-Link (YouTube, Instagram oder andere HTTPS-Adresse)</label><input class="input" name="url" type="url" placeholder="https://..." value="${esc(e.url||'')}"/></div><div class="field"><label>Bild-URL (eigenes / freigegebenes Motiv)</label><input class="input" name="imageUrl" type="url" placeholder="https://.../bild.jpg" value="${esc(e.imageUrl||'')}"/></div><div class="field"><label>Interaktives Übungswerkzeug</label><select class="input" name="challenge"><option value="" ${e.challenge!=='pressure-3v3'?'selected':''}>Keine Challenge</option><option value="pressure-3v3" ${e.challenge==='pressure-3v3'?'selected':''}>FUNiño · Druckzonen-Challenge</option></select></div><div class="notice green">${ic('info')} Ohne Bild zeigt SpielfeldIQ eine eigens erzeugte Spielfeldskizze. YouTube-Videos werden erst nach einem Klick geladen; Instagram öffnet sich separat.</div><button type="submit" class="btn">${ic('save')} Medien speichern</button></form>`}
 else if(m.type==='pick-exercise'){title=`Übung für Station ${m.slot+1}`;body=`<div class="stack">${data.exercises.map(e=>`<button class="ghost" data-act="pick-exercise" data-id="${esc(e.id)}" data-slot="${m.slot}" style="display:flex;justify-content:space-between;text-align:left"><span><strong>${esc(e.name)}</strong><br/><span class="tiny">${esc(e.category)} · ${e.minutes} Min.</span></span>${ic('plus')}</button>`).join('')}</div>`}
else if(m.type==='choose-slot'){let e=exercise(m.id);title='In Trainingsplan übernehmen';body=`<p class="muted smalltxt">${esc(e.name)} – welche Station soll ersetzt werden?</p><div class="stack section-gap">${data.current.exerciseIds.slice(0,visibleStations()).map((x,i)=>`<button class="ghost" data-act="pick-exercise" data-id="${esc(m.id)}" data-slot="${i}" style="justify-content:space-between"><span>Station ${i+1} · ${esc(exercise(x).name)}</span>${ic('arrow')}</button>`).join('')}</div>`}
else if(m.type==='balance'){const moves=suggestBalance();title='Tagesgruppen ausgleichen';body=`${moves.length?`<p class="muted">SpielfeldIQ schlägt ${moves.length} minimale Umbesetzung(en) für gleichmäßigere Gruppen vor. Die Stammgruppen bleiben unverändert.</p><div class="details-block">${moves.map(x=>{let p=data.players.find(p=>p.id===x.pid);return `<div class="schedule-row"><strong>${esc(p?.name||'Kind')}</strong><span class="tiny" style="margin-left:auto">${esc(x.from)} → ${esc(x.to)}</span></div>`}).join('')}</div>${btn(ic('check')+' Vorschlag übernehmen','apply-balance','btn')}`:'<div class="notice green">Die Tagesgruppen sind bereits ausgewogen. Keine Umbesetzung notwendig.</div>'}`}
else if(m.type==='suggest'){const picks=data.exercises.filter(e=>!data.current.exerciseIds.includes(e.id)).sort((a,b)=>plannedCount(a.id)-plannedCount(b.id)).slice(0,4);title='Übungen vorschlagen';body=`<div class="notice blue">${ic('sparkles')} Regelbasierter Demo-Vorschlag aus deiner Bibliothek. Eine echte KI-Anbindung ist im Prototyp noch nicht enthalten.</div><div class="stack section-gap">${picks.map(e=>`<div class="exercise"><div class="exercise-icon">${ic('ball')}</div><div class="exercise-body"><h3>${esc(e.name)}</h3><p class="tiny">${esc(e.category)} · ${plannedCount(e.id)}× bisher eingeplant</p>${btn(ic('plus')+' Übernehmen','add-to-plan','btn small section-gap',`data-id="${esc(e.id)}"`)}</div></div>`).join('')}</div>`}
else if(m.type==='add-player'){title='Kind zum Kader hinzufügen';body=`<form id="player-form" class="stack"><div class="field"><label>Name oder Kürzel *</label><input class="input" name="name" required maxlength="60" placeholder="z. B. Kind 25"/></div><div class="field"><label>Stammgruppe</label><select name="group" class="input">${GROUPS.map(g=>`<option>${g}</option>`).join('')}</select></div><button class="btn" type="submit">${ic('plus')} Kind anlegen</button></form>`}
else if(m.type==='add-coach'){title='Trainer hinzufügen';body=`<form id="coach-form" class="stack"><div class="field"><label>Trainername *</label><input class="input" name="name" required maxlength="60"/></div><button class="btn" type="submit">${ic('plus')} Trainer anlegen</button></form>`}
else if(m.type==='history-detail'){let s=[...data.sessions,data.current].find(x=>x.id===m.id);title='Trainingsvorbereitung';body=s?`<div class="muted smalltxt">${esc(localDate(s.date))}</div><h2 class="section-gap">${esc(s.theme)}</h2><div class="pillrow section-gap"><span class="pill">${s.headcount??presentPlayers(s).length} Kinder</span><span class="pill">${s.groupCount} Gruppen</span><span class="pill">${s.stationCount} Stationen</span></div><div class="details-block"><h3>Geplante Stationen</h3>${s.exerciseIds.slice(0,s.stationCount).map((x,i)=>`<p>${i+1}. ${esc(exercise(x).name)}</p>`).join('')}</div><div class="tip">Status: ${s.status==='done'?'Durchführung bestätigt':'Nur Vorbereitung belegt'}. Einzelne historische Kinderzuordnungen wurden bewusst nicht aus Bildern rekonstruiert.</div>${btn(ic('swap')+' Als Vorlage verwenden','duplicate','btn section-gap',`data-id="${s.id}"`)}`:''}
else if(m.type==='pdf-ready'){title='Trainingsplan als PDF';body=`<div class="notice green">${ic('check')} PDF fertig: ${Math.max(1,Math.ceil((currentPdfBlob?.size||0)/1024))} KB. Funktioniert unabhängig von window.print().</div><div class="pdf-action-row"><a class="btn" href="${currentPdfUrl}" target="_blank" rel="noopener">${ic('external')} PDF ansehen</a><button class="btn secondary" data-act="pdf-share">${ic('upload')} Auf iPhone teilen</button></div><a class="ghost" style="width:100%;text-align:center" href="${currentPdfUrl}" download="SpielfeldIQ-Training-${data.current.date}.pdf">${ic('download')} PDF herunterladen</a><p class="tip section-gap">Falls die iOS-Dateivorschau leer bleibt: „Auf iPhone teilen“ wählen und „In Dateien sichern“ auswählen. Bei Bedarf die PDF direkt in Safari öffnen.</p>`}
 else if(m.type==='cloud'){title='SpielfeldIQ · Cloud';body=`<div class="stack"><p class="muted smalltxt">Private Cloud-Sicherung. Deine App funktioniert weiterhin offline. Daten werden <strong>nur nach deiner Bestätigung</strong> gespeichert oder geladen.</p><div id="cloud-indicator" class="notice green">Anmeldung wird geprüft …</div><div class="field"><label>Deine E-Mail-Adresse für den Login</label><input id="cloud-email" class="input" type="email" autocomplete="email" placeholder="name@example.com"/></div><div class="details-block"><h3>Mit E-Mail & Passwort anmelden</h3>
<div class="field"><label>Passwort</label><input id="cloud-login-password" class="input" type="password" autocomplete="current-password" minlength="1" placeholder="Dein bestehendes Passwort"/></div>
<button type="button" class="btn section-gap" id="cloud-login-password-btn">Mit Passwort anmelden</button>
<p class="tiny section-gap">Bereits über Magic Link registriert? Melde dich einmal mit dem Link an und lege unten für dasselbe Konto ein Passwort fest.</p></div>
<details class="details-block"><summary style="cursor:pointer;color:#bcf57a;font-weight:800;padding:8px 0">Passwort einrichten / Konto verwalten</summary>
<div class="field"><label>Neues Passwort (mindestens 12 Zeichen)</label><input id="cloud-new-password" class="input" type="password" autocomplete="new-password" minlength="12" placeholder="Langes, einzigartiges Passwort"/></div>
<div class="field section-gap"><label>Neues Passwort wiederholen</label><input id="cloud-confirm-password" class="input" type="password" autocomplete="new-password" minlength="12" placeholder="Passwort wiederholen"/></div>
<div class="stack section-gap">
<button type="button" class="ghost" id="cloud-register">Neues Konto registrieren</button>
<button type="button" class="ghost" id="cloud-set-password">Passwort für mein angemeldetes Konto festlegen</button>
</div><p class="tiny section-gap">Bei einer Neuregistrierung kann Supabase zunächst eine Bestätigungs-E-Mail verlangen. Für bestehende Magic-Link-Konten bitte keine zweite Registrierung vornehmen.</p></details>
<div class="divider"></div><details class="details-block"><summary style="cursor:pointer;color:#bcf57a;font-weight:800;padding:8px 0">Alternativ per E-Mail-Link oder Code anmelden</summary><p class="tiny">Der Versand ist begrenzt; bitte bei einer Rate-Limit-Meldung keine weiteren E-Mails anfordern.</p>
<button type="button" class="btn" id="cloud-mail">Anmeldelink per E-Mail senden</button><div class="field"><label>Einmalcode aus der E-Mail (falls vorhanden)</label><input id="cloud-otp" class="input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-stelliger Code"/></div><button type="button" class="ghost" id="cloud-verify">Mit E-Mail-Code anmelden</button></details><div class="divider"></div><button type="button" class="btn secondary" id="cloud-upload">Lokale Daten in Cloud sichern</button><button type="button" class="ghost" id="cloud-download">Cloud-Daten auf dieses Gerät laden</button><button type="button" class="ghost" id="cloud-signout">Abmelden</button><p class="tip">Vor dem erstmaligen Laden zuerst unter Einstellungen ein JSON-Backup erstellen! Bei Änderungen auf mehreren Geräten gibt es einen Versionsschutz, aber noch keine automatische Zusammenführung. Nur für deine eigenen Daten – gemeinsame Teamfreigaben folgen später.</p></div>`}
else if(m.type==='settings'){title='Einstellungen & Daten';body=`<div class="stack"><div class="field"><label>Verein / Team</label><input id="team-name" class="input" value="${esc(data.team)}"/></div><div class="field"><label>Altersklasse</label><select id="team-age" class="input">${Array.from({length:14},(_,i)=>'U'+(i+6)).map(a=>`<option ${data.age===a?'selected':''}>${a}</option>`).join('')}<option ${data.age==='Erwachsene'?'selected':''}>Erwachsene</option></select></div><div class="divider"></div>${btn(ic('download')+' Alle Daten als JSON exportieren','export','btn')}${btn(ic('save')+' Cloud-Synchronisierung','cloud','btn secondary')}${btn(ic('upload')+' JSON-Daten importieren','import','ghost')}<input type="file" id="import-file" accept=".json,application/json" style="display:none"/><div class="notice green">${ic('info')} Ohne aktive Cloud-Synchronisierung bleiben deine Daten lokal auf diesem Gerät. Cloud-Sicherung ist über den Button oben separat möglich. Externe Bilder und Videos werden nur von den jeweiligen Anbietern geladen; Videos erst nach Klick. Bitte regelmäßig exportieren!</div>${btn(ic('trash')+' Demodaten zurücksetzen','reset-data','btn danger')}<p class="tip">SpielfeldIQ · Offline-first und optionale private Supabase-Sicherung. Keine automatische Synchronisierung.</p></div>`}
qs('#modal-root').innerHTML=`<div class="modal-back" data-act="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button class="icon-btn" type="button" data-act="close-modal" aria-label="Schließen">${ic('close')}</button></div>${body}</div></div>`}

function safePicture(str){const u=validUrl(str||'');return u&&u.startsWith('https://')?u:null}
function youtubeId(url){try{const u=new URL(url);const host=u.hostname.replace(/^www\./,'');if(['youtube.com','m.youtube.com','youtube-nocookie.com'].includes(host)){const v=u.searchParams.get('v')||u.pathname.match(/^\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})/)?.[1];return /^[A-Za-z0-9_-]{11}$/.test(v||'')?v:null}if(host==='youtu.be'){const id=u.pathname.replace(/^\//,'');return /^[A-Za-z0-9_-]{11}$/.test(id)?id:null}}catch(e){}return null}
function pitchDiagram(ex,compact=false){
 const cat=ex.category||'Spielform';const isPass=cat==='Passspiel',isSpace=cat==='Raumverhalten',isOver=cat==='Überzahl',isShot=cat==='Torschuss',isDribble=cat==='Dribbling';

function pdfPlain(value){return String(value??'').replace(/[\u2013\u2014]/g,'-').replace(/\u2192/g,' -> ').replace(/\u2190/g,' <- ').replace(/\u2022/g,' - ').replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/[^\x20-\x7E\u00A0-\u00FF]/g,'?')}
function pdfBytes(text){const out=new Uint8Array(text.length);for(let i=0;i<text.length;i++)out[i]=text.charCodeAt(i)&255;return out}
function createTrainingPdf(session=data.current){
 const W=595,H=842,M=40,bottom=52;const pages=[];let commands=[],y=H-M;
 const rgb=(hex)=>{hex=hex.replace('#','');return [0,2,4].map(i=>(parseInt(hex.slice(i,i+2),16)/255).toFixed(3)).join(' ')};

 const page=()=>{if(commands.length)pages.push(commands.join('\n'));commands=[];y=H-M};
 const box=(x,top,w,h,color)=>commands.push(`${rgb(color)} rg ${x.toFixed(1)} ${(H-top-h).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)} re f`);

 const txt=(str,x,top,size=10,bold=false,color='#1b2a28')=>commands.push(`BT /${bold?'F2':'F1'} ${size} Tf ${rgb(color)} rg 1 0 0 1 ${x.toFixed(1)} ${top.toFixed(1)} Tm (${F(str)}) Tj ET`);
 const chunks=(str,max)=>{const output=[];for(const paragraph of pdfPlain(str).split(/\n/)){const words=paragraph.split(/\s+/);let row='';for(const word of words){if((row+' '+word).trim().length>max && row){output.push(row);row=word}else row+=(row?' ':'')+word}output.push(row)}return output};
 const ensure=(need)=>{if(y-need<bottom)page()};

 const wrap=(s,max=87,sz=10,bold=false,color='#1b2a28',left=M)=>{for(const row of chunks(s,max))textLine(row,sz,bold,color,left)};
 const section=(label)=>{y-=3;ensure(35);box(M,H-y-7,W-2*M,22,'#dcefe3');txt(label,M+9,y-8,11,true,'#1e4536');y-=26};
 box(0,0,W,7,'#86c94b');
 textLine(`${data.team} ${data.age}`,19,true,'#143b30');
 textLine(`${localDate(session.date)}  |  ${session.start} - ${addMin(session.start,totalDuration(session))}`,10,false,'#61716a');
 wrap(`THEMA: ${session.theme}`,60,12,true);
 textLine(`Kinder: ${session.headcount??presentPlayers(session).length}   Trainer: ${(session.availableCoaches||[]).length}   Gruppen: ${session.groupCount}   Stationen: ${session.stationCount}`,9);
 section('TRAININGSABLAUF');
 for(const t of timetable(session)){wrap(`${t.time}  |  ${t.name}  (${t.minutes} Min.)`,77,10,true)}
 section('GRUPPEN & ANWESENHEIT');
 if(session.attendance){for(const g of selectedGroups(session)){const ppl=groupPlayers(g,session).map(p=>p.name);textLine(`${g} (${ppl.length}): ${ppl.join(', ')||'keine Kinder'}`,9,false,'#20372d')}}
 else textLine(`Archiv-Vorbereitung: ${session.headcount||'?'} Kinder; konkrete Tagesgruppen nicht hinterlegt.`,9,false,'#20372d');
 section('STATIONEN & TRAINER');
 session.exerciseIds.slice(0,visibleStations(session)).forEach((id,i)=>{const ex=exercise(id);ensure(45);textLine(`${i+1}. ${ex.name}  |  Trainer: ${(session.stationCoaches||[])[i]||'offen'}`,10,true);wrap(ex.description||'',88,9,false,'#5c6c64');y-=2});
 wrap(`Je Station ${session.stationMinutes} Minuten, dazwischen ${session.breakMinutes} Minuten Wechselpause.`,85,9);
 section('ROTATION');
 const gs=selectedGroups(session),width=(W-2*M-48)/gs.length;
 ensure(34);box(M,H-y-8,W-2*M,22,'#204c39');txt('R',M+10,y-7,9,true,'#ffffff');gs.forEach((g,i)=>txt(g,M+48+i*width+4,y-7,9,true,'#ffffff'));y-=31;

 textLine(`Trainer: ${(session.availableCoaches||[]).join(', ')||'nicht hinterlegt'}`,9);

 const objects=[null],add=s=>{objects.push(s);return objects.length-1};
 const font1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'),font2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');

document.addEventListener('submit',e=>{if(!['exercise-form','player-form','coach-form','media-form'].includes(e.target.id))return;e.preventDefault();const form=e.target,f=new FormData(form);if(form.id==='media-form'){const eid=form.dataset.id,url=String(f.get('url')||'').trim(),imageUrl=String(f.get('imageUrl')||'').trim();if((url&&!validUrl(url))||(imageUrl&&!safePicture(imageUrl))){notify('Bitte gültige HTTPS-Bild-URL bzw. Videolink angeben');return}edit(()=>{let x=exercise(eid);x.url=validUrl(url)||'';x.imageUrl=safePicture(imageUrl)||'';x.challenge=String(f.get('challenge'))==='pressure-3v3'?'pressure-3v3':'';ui.modal=null});notify('Medien aktualisiert');return}if(form.id==='exercise-form'){let name=String(f.get('name')||'').trim(),url=String(f.get('url')||'').trim(),imageUrl=String(f.get('imageUrl')||'').trim();if(!name){notify('Bitte Namen eingeben');return}if(url&&!validUrl(url)){notify('Bitte gültige http(s)-URL eingeben');return}if(imageUrl&&!validUrl(imageUrl)){notify('Bitte gültige Bild-URL eingeben');return}edit(()=>{data.exercises.unshift({id:id(),name,url:validUrl(url)||'',imageUrl:validUrl(imageUrl)||'',category:String(f.get('category')),minutes:Math.max(1,Math.min(90,+f.get('minutes')||10)),description:String(f.get('description')||'').trim(),setup:String(f.get('setup')||'').trim(),coaching:String(f.get('coaching')||'').trim(),equipment:String(f.get('equipment')||'').trim(),age:data.age,favorite:false,challenge:String(f.get('challenge'))==='pressure-3v3'?'pressure-3v3':''});ui.modal=null;ui.view='library'});notify('Übung gespeichert')}else if(form.id==='player-form'){let name=String(f.get('name')||'').trim();if(!name)return;edit(()=>{let x={id:id(),name,baseGroup:String(f.get('group'))};data.players.push(x);data.current.attendance[x.id]=true;ui.modal=null});notify('Kind hinzugefügt')}else if(form.id==='coach-form'){let name=String(f.get('name')||'').trim();if(!name)return;if(data.coaches.includes(name)){notify('Trainer existiert bereits');return}edit(()=>{data.coaches.push(name);data.current.availableCoaches.push(name);ui.modal=null});notify('Trainer hinzugefügt')}});
setInterval(()=>{if(!ui.running)return;let now=Date.now(),delta=Math.floor((now-ui.timerStamp)/1000);if(delta<1)return;ui.timerStamp+=delta*1000;ui.timer=Math.max(0,ui.timer-delta);let el=qs('#timer-value'),prog=qs('#timer-progress');if(el)el.textContent=timeString(ui.timer);if(prog)prog.style.width=`${Math.max(0,ui.timer/(data.current.stationMinutes*60)*100)}%`;if(ui.timer===0){ui.running=false;timerCheckpoint();notify('Runde beendet!')}else if(Date.now()-ui.timerSavedAt>10000){ui.timerSavedAt=Date.now();timerCheckpoint()}} ,250);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ui.running){let elapsed=Math.max(0,Math.floor((Date.now()-ui.timerStamp)/1000));if(elapsed>0){ui.timer=Math.max(0,ui.timer-elapsed);ui.timerStamp=Date.now();if(ui.timer===0)ui.running=false;timerCheckpoint();render()}}});
